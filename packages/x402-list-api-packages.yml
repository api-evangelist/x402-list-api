description: >-
  x402 List publishes exactly one first-party package: the local stdio build of
  its MCP server. It ships NO general-purpose client SDK in any language, and
  says so deliberately — the API docs read "No JavaScript, no login, no SDK
  required", the contract is keyless JSON over HTTPS, and the provider points
  consumers at curl, the OpenAPI document and the hosted MCP endpoint instead.
  That is a design position rather than a gap, but it is recorded here as zero
  SDKs so the number is not credited to something it is not.
