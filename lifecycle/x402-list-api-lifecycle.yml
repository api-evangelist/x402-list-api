  semantic_changes_disclosed:
    - change: >-
        The `verified` filter on GET /services was narrowed to the FORTE tier (a
        paid delivery-probe settled on-chain and delivered, revocable on
        payTo/schema drift); the broad "answers a valid x402 challenge and is
        alive" signal it used to carry moved to the new `payment_ready`
        parameter.
      disclosed_at: https://x402-list.com/api
      note: >-
        A breaking semantic change to an existing parameter, disclosed in prose
        on the reference page rather than through a version bump or a
        deprecation header. Recorded here because it is exactly the kind of
        change a Sunset/Deprecation policy would otherwise carry.
