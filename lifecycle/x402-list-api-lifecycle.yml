description: >-
  x402 List versions its API in the path (/api/v1) and runs a genuine public
  status surface — both a human dashboard at /status and a machine-readable
  /api/health that its own RFC 9727 api-catalog advertises under the "status"
  link relation. What it does NOT publish is a deprecation or sunset policy: no
  operation in the contract is marked deprecated, the strings "deprecated" and
  "sunset" appear nowhere in the OpenAPI document, and no RFC 8594
  Deprecation/Sunset headers are documented or observed. There is also no SLA.
  That is the honest gap for a young, single-operator directory, and it is
  recorded rather than smoothed over.
versioning:
  scheme: path
  current_version: v1
  base: https://x402-list.com/api/v1
  spec_version: 1.0.0
  policy_published: false
  note: >-
    A second version axis is published and does have a stated compatibility rule:
    meta.ranking_version on GET /best pins the recommender scoring generation
    (currently 3) and the provider states plainly that scores stored under an
    earlier generation are not comparable. The compliance checklist likewise grew
    from 11 checks to 14 and historical score points keep the denominator they
    were measured with. Both are documented data-compatibility contracts, not API
    version policy.
