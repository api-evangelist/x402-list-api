  /changes:
    get:
      operationId: listServiceChanges
      summary: Feed of service change events
      description: 'Returns change events detected on the live x402 wire: a payTo (settlement address)
        rotation, a price move, or a schema change (endpoints, networks, assets, or protocol version added
        or removed). Each event is diffed from the ENTIRE accepts[] a service returns on every probe,
        so a payTo rotation at an unchanged price - invisible to price-only tracking - shows up here.
        Newest first, over a rolling window (days). Events are retained perpetually; the window only bounds
        the feed. meta.type_counts breaks the window down by event type and meta.window_total gives the
        events in it, so ONE call returns all four figures (before, the breakdown took a filtered call
        per type plus one more for the total). Both cover the whole window: they are scoped by days and
        by the service filter, but NOT by the type filter. So with ?type=price_changed, meta.total counts
        the filtered feed you are paging while meta.type_counts still reports every type; the two are
        meant to differ. Each type in the enum is always present, 0 included, and type_counts sums to
        meta.window_total while every event carries one of the enum types; a type not yet in the enum
        still counts toward window_total but into no bucket.'
      tags:
      - Changes
      parameters:
      - name: service
        in: query
        schema:
          type: string
        description: Filter to a single service by slug.
      - name: type
        in: query
        schema:
          type: string
          enum:
          - payto_changed
          - price_changed
          - schema_changed
        description: Filter by event type. A value outside the enum returns 400 Bad Request.
      - name: days
        in: query
        schema:
          type: integer
          default: 90
          minimum: 1
          maximum: 365
        description: Rolling window in days (clamped to 1-365).
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page number
      - name: per_page
        in: query
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 100
        description: Results per page
      responses:
        '200':
          description: Paginated feed of change events, newest first
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceChangeEvent'
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/PaginationMeta'
                    - type: object
                      properties:
                        days:
                          type: integer
                          description: Rolling window in days applied to this feed
                        type_counts:
                          type: object
                          description: Events per type over the whole window, scoped by days and by the
                            service filter but NOT by the type filter. Every type in the enum is present,
                            0 included, so an absent type and a type with no events are never confused.
                          properties:
                            payto_changed:
                              type: integer
                            price_changed:
                              type: integer
                            schema_changed:
                              type: integer
                        window_total:
                          type: integer
                          description: Events in the whole window, ignoring the type filter. Equals meta.total
                            when no type filter is set. It equals the sum of type_counts while every event
                            carries one of the enum types; a type not yet in the enum is counted here
                            but in no bucket.
                  provenance:
                    $ref: '#/components/schemas/Provenance'
              example:
                data:
                - slug: acme-generate
                  name: Acme Generate
                  type: payto_changed
                  observed_at: '2026-07-24T09:12:00.000Z'
                  summary:
                    payToAdded:
                    - 0x1111…1111
                    payToRemoved:
                    - 0x2222…2222
                  old_snapshot:
                  - endpoint: GET /v1/generate
                    scheme: exact
                    network: eip155:8453
                    asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
                    assetName: USDC
                    payTo: 0x2222…2222
                    price: '10000'
                    mimeType: application/json
                    x402Version: 2
                  new_snapshot:
                  - endpoint: GET /v1/generate
                    scheme: exact
                    network: eip155:8453
                    asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
                    assetName: USDC
                    payTo: 0x1111…1111
                    price: '10000'
                    mimeType: application/json
                    x402Version: 2
                meta:
                  total: 1
                  page: 1
                  per_page: 25
                  total_pages: 1
                  days: 90
                  type_counts:
                    payto_changed: 1
                    price_changed: 0
                    schema_changed: 0
                  window_total: 1
        '400':
          description: Invalid type filter (outside the accepted set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
