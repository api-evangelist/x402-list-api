openapi: 3.1.0
info:
  title: x402 List API
  version: 1.0.0
  description: 'Public REST API for x402-list.com - the directory of all services using the x402 protocol
    (HTTP 402 Payment Required). x402 is an open standard by Coinbase for internet-native, agent-first
    payments. This API provides programmatic access to service listings, uptime monitoring data, pricing
    information, and network stats. No authentication required for read access. Rate limited to 200 req/min
    per IP. Reads are free for agents and point queries; sustained bulk pulling beyond 2,000 GET requests/day
    per IP (UTC day) on /api/v1/* is metered via x402 at $0.01/request on Base. Metered responses carry
    an X-Meter-Remaining header (free requests left today for this IP) and an X-Meter-Reset header (the
    Unix timestamp in seconds at which that daily quota resets, the next 00:00 UTC). The directory data
    returned by this API is licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/); the API
    specification document itself stays MIT (see license). Reuse is permitted with attribution to x402-list.com.
    Every 2xx JSON response from the endpoints documented here is wrapped in an envelope carrying a single
    top-level provenance object (see the Provenance schema) that declares the data license, the required
    attribution string, and a cite_as canonical URL; those responses also send a Link: <https://creativecommons.org/licenses/by/4.0/>;
    rel="license" header. To request delisting, email info@x402-list.com or update your listing at /services/<slug>/update.
    Example values shown throughout this specification are illustrative and synthetic; query the live
    endpoints for current figures.'
  contact:
    name: x402 List
    url: https://x402-list.com
    email: info@x402-list.com
  termsOfService: https://x402-list.com/terms
  license:
    name: MIT
  x-data-license: CC-BY-4.0
servers:
- url: https://x402-list.com/api/v1
  description: Production
paths:
  /services:
    get:
      operationId: listServices
      summary: List all x402 services
      description: Returns a paginated list of registered x402 services with computed fields like uptime,
        pricing, and endpoint count. Supports filtering by network, status, category, verification state,
        signability of the 402 envelope, and full-text search.
      tags:
      - Services
      parameters:
      - name: network
        in: query
        schema:
          type: string
        description: Filter by single network abbreviation (e.g. BSE, SOL, POL; the full list is served
          by /networks). An unrecognized abbreviation returns 400 Bad Request.
        example: BSE
      - name: status
        in: query
        schema:
          type: string
          enum:
          - online
          - degraded
          - offline
          - unknown
        description: Filter by service status. An unrecognized value returns 400 Bad Request; omit the
          parameter to include every status.
      - name: category
        in: query
        schema:
          type: string
          enum:
          - AI
          - Blockchain
          - Compute
          - Content
          - Data
          - Finance
          - Other
          - Verification
        description: Filter by category, one of the closed category set (case-insensitive). A value outside
          the set returns 400 Bad Request; omit to include every category.
        example: AI
      - name: verified
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: 'Filter by the FORTE verification tier: a paid delivery-probe settled on-chain and
          delivered AND the badge was not since revoked on payTo/schema drift (no time decay). true =
          delivery-verified only, false = everything else. Omit to include both. SEMANTIC CHANGE (treno
          D3): this filter previously meant "answered a valid x402 challenge and is alive" - that broad
          signal is now the payment_ready parameter. This tier starts empty and grows only with real payments,
          so verified=true can legitimately return 0 rows. Applied server-side, so meta.total counts the
          filtered set. Any other value returns 400 Bad Request.'
        example: 'true'
      - name: payment_ready
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: 'Filter by the BASE payment-ready tier: the endpoint answered a valid x402 402 challenge
          and is alive within the decay window (a probe success within the last 7 days, or it is api-key
          exempt). true = payment-ready only, false = everything else. Omit to include both. This is the
          broad discovery signal the verified parameter used to carry before treno D3. Applied server-side,
          so meta.total counts the filtered set. Any other value returns 400 Bad Request.'
        example: 'true'
      - name: source
        in: query
        schema:
          type: string
          enum:
          - submitted
          - imported
          - imported:bazaar
          - imported:x402scan
          - all
        description: 'Filter by provenance (how the listing entered the directory, matching the source
          field on each item): submitted, imported (any imported:* origin), imported:bazaar, imported:x402scan,
          or all for no filter. An unrecognized value returns 400 Bad Request.'
        example: submitted
      - name: signable
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: 'Filter on the SIGNABILITY of the last observed 402 envelope: true = no EVM route
          of the service was observed missing the EIP-712 domain parameters (extra.name and extra.version)
          that a standard x402 client requires in order to sign a payment; false = at least one such route
          was observed. This describes the payment envelope on the wire, not the merit or reliability
          of the service. Derived from the eip712_domain_extra check of the latest assessment (the same
          id that appears in assessment.compliance_failed_checks). A service whose latest assessment has
          not measured that check yet (never assessed, assessed before the check existed, or assessed
          with no 402 payload captured at all) matches NEITHER value: omit the parameter to include it.
          Applied server-side, so meta.total counts the filtered set. Any other value returns 400 Bad
          Request.'
        example: 'true'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - newest
          - uptime
          - cheapest
          - endpoints
          default: newest
        description: Sort order. A value outside the enum returns 400 Bad Request.
      - name: q
        in: query
        schema:
          type: string
        description: Case-insensitive substring search across name, description, category, and base URL.
          The search and query parameters are accepted as aliases; q takes precedence when more than one
          is sent.
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page number
      - name: per_page
        in: query
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 100
        description: Results per page
      responses:
        '200':
          description: Paginated list of services
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
              example:
                data:
                - slug: weather-x402
                  name: Weather x402
                  description: Real-time weather data via x402 micropayments
                  base_url: https://weather-x402.example.com
                  category: Data
                  source: submitted
                  status: online
                  verified: true
                  payment_ready: true
                  endpoint_count: 3
                  min_price_usd: 0.001
                  networks:
                  - BSE
                  - SOL
                  networks_caip2:
                  - eip155:8453
                  - solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
                  uptime_24h: 99.8
                  avg_response_time_ms: 145
                  last_checked_at: '2026-04-13T10:30:00Z'
                  created_at: '2026-03-01T00:00:00Z'
                meta:
                  total: 15
                  page: 1
                  per_page: 25
                  total_pages: 1
        '400':
          description: Invalid filter value (status, sort, network, category, verified, payment_ready,
            source, or signable outside the accepted set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}:
    get:
      operationId: getService
      summary: Get service detail
      description: Returns full details for a single service including all active endpoints with their
        current pricing, uptime windows (24h/7d/30d/90d), average response time, and total check count.
      tags:
      - Services
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Service URL slug
        example: weather-x402
      responses:
        '200':
          description: Service detail with endpoints and pricing
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceDetail'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}/uptime:
    get:
      operationId: getServiceUptime
      summary: Get service uptime history
      description: Returns daily uptime snapshots for a service over the specified period. Each data point
        includes uptime percentage, average response time, and check counts.
      tags:
      - Services
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: weather-x402
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          - 90d
          default: 30d
        description: Time period
      responses:
        '200':
          description: Array of daily uptime data points
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UptimeDataPoint'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}/price:
    get:
      operationId: getServicePriceHistory
      summary: Get service price history
      description: Returns the captured HTTP 402 price movement over time for a service (USD), oldest
        first. Each point carries the endpoint id, network, and asset it was recorded for; independent
        endpoint/network/asset series are interleaved by time. is_current is not filtered, so this is
        the full price-movement series, not just the current price.
      tags:
      - Services
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: weather-x402
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          - 90d
          - all
          default: 90d
        description: Time window; "all" reads the full recorded history.
      responses:
        '200':
          description: Array of price points (oldest first)
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PricePoint'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '400':
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}/scores:
    get:
      operationId: getServiceScores
      summary: Get service assessment sub-score history
      description: 'Returns the MEASURED assessment sub-scores over time (x402 compliance grade plus reliability
        uptime/response windows), oldest first, one point per assessment run. These are the sub-scores
        only, not the ranked composite score published on the service page (that one is computed live
        over the current pool by GET /api/v1/best), and nothing on the point is AI-derived; the series
        is honest-empty until the service has been assessed. Read compliance_passed against the compliance_total
        of the SAME point, never against the current one: the checklist grew from 11 to 14 checks when
        the three signability checks landed (x402_version_current, eip712_domain_extra, version_channel_coherent),
        so the series carries a step at that date. Earlier points keep the denominator they were actually
        measured with; they are not recomputed, because that would mean rewriting an observation after
        the fact.'
      tags:
      - Services
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: weather-x402
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          - 90d
          - all
          default: 90d
        description: Time window; "all" reads the full recorded history.
      responses:
        '200':
          description: Array of sub-score points (oldest first)
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScorePoint'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '400':
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}/volume:
    get:
      operationId: getServiceVolume
      summary: Get service on-chain settlement volume history
      description: 'Returns the MEASURED on-chain settlement volume for a service over time (USD), one
        point per UTC day, oldest first. Volume is read directly from the chain by settler-address attribution
        over the service payTo mapping (USDC settlements only), never self-reported. It is a conservative
        undercount: only settlements the settler-attribution monitor observed are included, so a service
        can have real volume this series does not yet see. The series is honest-empty until a settlement
        is observed, and a service whose payTo sits on a network not under measurement will read empty
        here (see the assessment.traction status for why). Days with no observed settlement are omitted,
        so the series is sparse (one point per settled UTC day), not a dense daily grid.'
      tags:
      - Services
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: weather-x402
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          - 90d
          - all
          default: 90d
        description: Time window; "all" reads the full recorded history.
      responses:
        '200':
          description: Array of daily volume points (oldest first)
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VolumePoint'
                  caveat:
                    type: string
                    description: 'Fixed in-band note: the series is a conservative undercount and is operator-level
                      (the full payout address), not pro-rata, so do not sum it across services that share
                      a payout address'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '400':
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}/buyers:
    get:
      operationId: getServiceBuyers
      summary: Get service distinct on-chain buyer history
      description: Returns the MEASURED distinct on-chain buyer count for a service over time, one point
        per UTC day, oldest first. Distinct buyers are counted straight from the raw settlements per day
        (never summed across a rollup) over the service payTo mapping, USDC settlements only. Like the
        volume series it is a conservative undercount (only what the settler-attribution monitor observed)
        and honest-empty until a settlement is observed. Days with no observed settlement are omitted,
        so the series is sparse (one point per settled UTC day), not a dense daily grid.
      tags:
      - Services
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: weather-x402
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          - 90d
          - all
          default: 90d
        description: Time window; "all" reads the full recorded history.
      responses:
        '200':
          description: Array of daily distinct-buyer points (oldest first)
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BuyersPoint'
                  caveat:
                    type: string
                    description: 'Fixed in-band note: the series is a conservative undercount and is operator-level
                      (the full payout address), not pro-rata, so do not sum it across services that share
                      a payout address'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '400':
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}/checks:
    get:
      operationId: getServiceChecks
      summary: Get service check logs
      description: Returns raw monitoring check logs for a service, ordered by most recent first. Includes
        status code, response time, and endpoint discovery count.
      tags:
      - Services
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: weather-x402
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Number of results
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 50000
        description: Offset for pagination. Capped at 50000 (deep-pagination ceiling); a higher value
          is clamped down to that ceiling, not rejected.
      responses:
        '200':
          description: Check logs with total count
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckEntry'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /facilitators:
    get:
      operationId: listFacilitators
      summary: List x402 facilitators by on-chain verified volume
      description: 'Returns x402 facilitators ranked by their independently on-chain-verified USDC settlement
        volume across all measured chains. Volume is measured directly from blockchain transactions (settler-address
        attribution, EIP-3009 transferWithAuthorization to USDC). It is NOT self-reported or dashboard-quoted.
        For USDC, USD volume equals token volume 1:1. Each row carries 24h/7d/30d volume + settlement
        counts, the last on-chain activity timestamp, and the number of settler EOAs. Pass include=timeseries
        to also receive a per-facilitator daily volume series for charting, and/or include=chains for
        the per-(network,token) breakdown. Combine them comma-separated: include=timeseries,chains.'
      tags:
      - Facilitators
      parameters:
      - name: timeframe
        in: query
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          - all
          default: 7d
        description: Window that drives the sort order (volume descending); 'all' = all-time
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - timeseries
            - chains
        style: form
        explode: false
        description: 'Comma-separated optional embeds: "timeseries" (daily volume series per facilitator)
          and/or "chains" (per-(network,token) breakdown). Example: include=timeseries,chains'
      - name: days
        in: query
        schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 90
        description: Length of the embedded timeseries window (only with include=timeseries)
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page number
      - name: per_page
        in: query
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 100
        description: Results per page
      responses:
        '200':
          description: Paginated list of facilitators with on-chain volume
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacilitatorListItem'
                  meta:
                    $ref: '#/components/schemas/FacilitatorPaginationMeta'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
              example:
                data:
                - facilitator_id: coinbase
                  name: Coinbase
                  website_url: https://docs.cdp.coinbase.com/x402
                  volume_usd_24h: 41250.5
                  volume_usd_7d: 289110.75
                  volume_usd_30d: 1203400
                  volume_usd_all: 8841200
                  tx_count_24h: 8123
                  tx_count_7d: 56720
                  tx_count_30d: 241990
                  tx_count_all: 1894220
                  last_activity_at: '2026-06-16T09:00:00Z'
                  first_activity_at: '2026-01-01T00:00:00Z'
                  settler_count: 12
                  verification: on-chain
                meta:
                  total: 3
                  page: 1
                  per_page: 25
                  total_pages: 1
                  timeframe: 7d
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /facilitators/{id}:
    get:
      operationId: getFacilitator
      summary: Get a single facilitator detail
      description: 'Full detail for one facilitator (TRENO A D5): the list-row volume and settlement figures
        plus the per-(network, token) chains breakdown (now carrying first_activity_at), the on-chain
        settler EOAs, per-chain distinct buyers, average USD per settlement, a 7-day-vs-previous-7-day
        trend, the daily volume series (period=all returns the full history, matching the services), and
        the listed_services bridge (which directory services settle on-chain via this facilitator). An
        unknown id is matched case-insensitively and 301-redirected to the canonical id before a 404,
        since the stored id drives on-chain volume attribution byte-exact. avg_settlement_usd_all and
        avg_settlement_usd_30d are volume over settlement count and are null (never a fabricated 0) when
        there is nothing to average; trend_7d_vs_prev_7d is null when the previous window is empty. The
        buyers total is a declared UPPER BOUND: distinct buyers are counted per chain and never de-duplicated
        across chains or tokens, so prefer the per-chain figures.'
      tags:
      - Facilitators
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Facilitator id (case-insensitive; a non-canonical casing 301s to the canonical id)
