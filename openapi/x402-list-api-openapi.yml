  /submit:
    post:
      operationId: submitService
      summary: Submit a new service or facilitator for review
      description: 'Submit a new x402-compatible service, or an x402 facilitator (settlement operator),
        to be reviewed and listed in the directory. The optional body field "type" selects the branch:
        omit it (or use any value other than "facilitator") for a service submission; set "type": "facilitator"
        for a facilitator submission. Service submissions are automatically probed for valid HTTP 402
        responses on the provided endpoints. Facilitator submissions are checked for on-chain presence
        instead: the enabled EVM chains among the declared networks are scanned for recent USDC settlement
        activity originated by the submitted settler addresses (30-day window, 15 seconds total budget);
        Solana and chains outside the measured registry are recorded as declared claims and resolved at
        manual review. A failed or idle probe never blocks the submission. Every submission of either
        type is manually reviewed before appearing in the directory. A service URL on a free compute host
        (vercel.app, workers.dev, pages.dev, netlify.app, onrender.com, railway.app, fly.dev, herokuapp.com,
        replit.app, glitch.me, deno.dev, pythonanywhere.com, firebaseapp.com, web.app and similar) is
        answered with HTTP 402: submitting it costs a one-off $1 USDC on Base, non-refundable, which buys
        a place in the human review queue and nothing more. A service URL on static-only hosting (github.io,
        gitlab.io, surge.sh) or on a dev-tunnel domain (ngrok, trycloudflare.com, localhost.run, serveo.net
        and similar) is rejected with HTTP 400 at any price. Website URLs are rejected only when they
        are dev-tunnel domains. Facilitator submissions are rejected with HTTP 400 for any free-hosting
        website URL, with no paid option. Each email address may submit once every 7 days per submission
        type (service and facilitator cooldowns are tracked separately): a second submission of the same
        type within the cooldown returns HTTP 429 with a Retry-After header (seconds until the cooldown
        ends). Submissions still pending after the 7-day review window are automatically rejected and
        the submitter is notified by email.'
      tags:
      - Submissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ServiceSubmissionRequest'
              - $ref: '#/components/schemas/FacilitatorSubmissionRequest'
            examples:
              service:
                summary: Service submission (default branch)
                value:
                  url: https://api.example.com
                  email: dev@example.com
                  service_name: Example x402 API
                  description: AI-powered text generation via x402 payments
                  website_url: https://example.com
                  category: AI
                  endpoints:
                  - /v1/generate
                  - /v1/classify
                  notes: Supports both Base and Solana networks
              facilitator:
                summary: Facilitator submission (type=facilitator)
                value:
                  type: facilitator
                  email: operator@examplepay.com
                  facilitator_name: ExamplePay
                  website_url: https://examplepay.com
                  description: x402 settlement facilitator for USDC on Base and Solana
                  settler_addresses:
                  - '0x7c5fa2ab8c9d01234e56f7a8b9c0d1e2f3a4b5c6'
                  - 4Nd1mYQZ7d5xUEhFcq8xJwzB3tYkTn5eGf2u1V9pQrSt
                  networks:
                  - base
                  - solana
                  facilitator_id_slug: examplepay
                  token_claims:
                  - USDC
                  claimed_volume_usd: '125000'
                  notes: Settling x402 payments since May 2026
      responses:
        '201':
          description: Submission created, pending manual review
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      submission_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - pending
                      probe_result:
                        description: Result of the automatic pre-review probe; null when the probe timed
                          out or could not run. Service submissions report the HTTP 402 probe (endpoints_found,
                          errors); facilitator submissions report the on-chain presence probe (addresses_with_activity,
                          tx_count, errors) over the enabled EVM chains.
                        oneOf:
                        - type: object
                          title: Service probe result
                          properties:
                            endpoints_found:
                              type: integer
                            errors:
                              type: array
                              items:
                                type: string
                        - type: object
                          title: Facilitator probe result
                          properties:
                            addresses_with_activity:
                              type: array
                              items:
                                type: string
                              description: Submitted settler addresses with at least one settlement observed
                                in the probe window
                            tx_count:
                              type: integer
                              description: Total settlement transactions observed in the probe window
                                across the probed chains
                            errors:
                              type: array
                              items:
                                type: string
                        - type: 'null'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: 'Payment required (service branch only). Three cases: the service URL is on a free
            compute host ($1.00); the latest submission for this email or this service URL was rejected
            less than 14 days ago ($0.50, which replaces the 7-day cooldown, and once 14 days have passed
            resubmitting is free again); or both, in which case the two stack into a single $1.50 charge.
            Free-host fees are never refunded and buy review, not a listing. Read accepts[0].amount and
            resource.description for the amount and the reason of this particular charge; the body error
            code is "resubmission_fee_required" for the resubmit-only case and "free_host_fee_required"
            whenever the free-host fee is part of it. Pay accepts[0] with an x402-capable client and retry
            the same request with a PAYMENT-SIGNATURE header. When the charge layer is offline the free-host
            case is rejected with HTTP 400 instead, as it was before this fee existed. The PAYMENT-REQUIRED
            response header carries the same x402 PaymentRequired object base64-encoded, without the app-level
            message field (which is body-only).'
          headers:
            PAYMENT-REQUIRED:
              schema:
                type: string
              description: base64 JSON of the x402 PaymentRequired object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'
              example:
                x402Version: 2
                accepts:
                - scheme: exact
                  network: eip155:8453
                  asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
                  amount: '500000'
                  payTo: '0x0000000000000000000000000000000000000000'
                  maxTimeoutSeconds: 300
                  extra:
                    name: USD Coin
                    version: '2'
                resource:
                  url: https://x402-list.com/api/v1/submit
                  description: Resubmission fee after a rejected submission
                  mimeType: application/json
                  serviceName: x402 List
                error: resubmission_fee_required
                message: A submission from this email or for this URL was rejected less than 14 days ago,
                  so resubmitting now requires a $0.50 x402 payment on Base (USDC). Pay with an x402-capable
                  client by sending the request again with a PAYMENT-SIGNATURE header, or wait until 14
                  days have passed to resubmit for free. See https://x402-list.com/api for the flow.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}/request-update:
    post:
      operationId: requestServiceUpdate
      summary: Request an owner update to a listed service (F10)
      description: 'Service owners propose changes to the DECLARATIVE metadata of their listing: name,
        description, website_url, category, contact_email, new endpoints (endpoints_add, each optionally
        prefixed with its HTTP method), and base_url (an identity change, reviewed with extra scrutiny).
        Measured fields (verified, uptime, pricing, status, payTo) are read-only for everyone and cannot
        be updated through this channel. All fields are compared server-side against the live listing
        and only actual changes are recorded; submitting with no effective change returns HTTP 400. The
        response contains a ONE-TIME ownership token (returned only once, never stored in clear): publish
        it as a line of a plain-text file at {base_url origin}/.well-known/x402list.txt on the CURRENTLY
        listed domain, then call verify-ownership. The token expires after 72 hours. After verification
        the request goes to manual review ALWAYS; the requester is notified by email of the outcome. Nothing
        about a pending request is public. Cooldown: one update request per (email, service) pair every
        7 days (HTTP 429 with Retry-After). Only a live or approved request counts: a rejected request
        does not, so a corrected one can be sent immediately. A request already verified and under review
        for the same service blocks new ones (HTTP 409).'
      tags:
      - Submissions
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateRequest'
            example:
              email: owner@example.com
              name: Example x402 API
              base_url: https://api.example.com
              website_url: https://example.com
              category: AI
              description: AI-powered text generation via x402 payments
              contact_email: owner@example.com
              endpoints_add:
              - /v1/summarize
              - POST /v1/chat/completions
      responses:
        '201':
          description: Update request created, awaiting ownership verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - pending_verification
                      proposed_changes:
                        type: object
                        description: 'The server-computed diff: only the fields that actually differ from
                          the live listing. endpoints_add is echoed back normalized, as {method, path}
                          objects'
                      ownership_token:
                        type: string
                        description: One-time domain-proof token. Shown ONLY in this response; publish
                          it at the well_known_url before it expires
                      well_known_url:
                        type: string
                        format: uri
                      well_known_path:
                        type: string
                        enum:
                        - /.well-known/x402list.txt
                      token_expires_at:
                        type: string
                        format: date-time
                      verify:
                        type: object
                        description: The follow-up call that completes the proof
                      reissue:
                        type: object
                        description: 'The recovery call if the ownership_token is lost: POST it once and
                          a replacement is emailed to the address on the request'
                      note:
                        type: string
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '400':
          description: Validation error or no effective change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A verified update request for this service is already under review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}/reissue-token:
    post:
      operationId: reissueOwnershipToken
      summary: Re-issue a lost ownership token for an update request (F10)
      description: 'The ownership token is returned exactly once, by request-update. If it is lost, this
        endpoint queues a replacement: POST the request_id together with the SAME email that created the
        request. The new token is delivered BY EMAIL ONLY, to the address already on the request, and
        never appears in this response. The response is deliberately identical in every case (request
        found or not, wrong email, already verified, already reviewed, token expired, re-issue already
        queued): this endpoint is not an oracle for whether a pending update request exists, which is
        information x402-list does not publish. For the same reason there is no GET. One re-issue per
        update request: it restores access to the proof, it does not extend the request indefinitely.
        Lost a second time: send a new update request once the current one lapses, since a pending request
        with a live token is what holds the 7-day cooldown on that email and listing. A request whose
        token has already expired holds nothing, so its replacement can go out immediately. Rate limited
        per IP more tightly than the general API budget.'
      tags:
      - Submissions
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              - email
              properties:
                request_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                  description: The email used to create the update request
            example:
              request_id: 3f6b1c2a-9d4e-4f6a-8b7c-1a2b3c4d5e6f
              email: owner@example.com
      responses:
        '200':
          description: Accepted. The same body is returned whether or not a matching request exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - accepted
                      message:
                        type: string
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '400':
          description: Missing or malformed request_id / email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{slug}/verify-ownership:
    post:
      operationId: verifyServiceOwnership
      summary: Verify domain ownership for an update request (F10)
      description: 'Completes the domain proof for a pending update request: the server fetches {base_url
        origin}/.well-known/x402list.txt from the CURRENTLY listed domain (SSRF-guarded, redirects revalidated,
        10s timeout) and matches the published token against the stored hash. The token is one-shot: on
        success it is consumed and cannot verify again. If the proposed diff touches base_url or adds
        endpoints, the standard HTTP 402 probe runs right after verification and its result is attached
        for the reviewer. Verification never auto-applies anything: review remains manual and the outcome
        is emailed.'
      tags:
      - Submissions
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                request_id:
                  type: string
                  format: uuid
            example:
              request_id: 3f6b1c2a-9d4e-4f6a-8b7c-1a2b3c4d5e6f
      responses:
        '200':
          description: Ownership verified (or already verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - verified
                        - already_verified
                      probe_result:
                        description: HTTP 402 probe summary when the diff touches base_url/endpoints;
                          null otherwise or when the probe timed out
                        oneOf:
                        - type: object
                          properties:
                            endpoints_found:
                              type: integer
                            errors:
                              type: array
                              items:
                                type: string
                        - type: 'null'
                      note:
                        type: string
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '400':
          description: Well-known file unreachable or token not found in it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request already reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Ownership token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /suggestions:
    post:
      operationId: postSuggestion
      summary: Post a paid suggestion for the directory (F11)
      description: 'Suggest a change, feature, bug, or data fix for the x402 List directory itself. The
        feedback channel is paid in x402: every suggestion costs a one-time $0.10 USDC (x402) payment
        on Base, as anti-spam skin-in-the-game. There is NO refund. Suggestions are internal and manually
        reviewed; they are never published and there is no public roadmap. This endpoint is agent-first
        (JSON only). The paid flow is the standard x402 handshake: the first call (no PAYMENT-SIGNATURE)
        returns HTTP 402 with a PAYMENT-REQUIRED header and an accepts[] body (single option, $0.10 USDC
        on Base) plus the app-level error code suggestion_fee_required; sign the payment and retry the
        same request with a PAYMENT-SIGNATURE header. On success the 201 carries a PAYMENT-RESPONSE header.
        When the payment layer is not configured, the endpoint answers HTTP 503 (suggestions temporarily
        unavailable).'
      tags:
      - Suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionRequest'
            example:
              text: Add a /api/v1/services bulk export endpoint for offline indexing
              category: feature
              email: agent@example.com
      responses:
        '201':
          description: Suggestion received, pending manual review
          headers:
            PAYMENT-RESPONSE:
              schema:
                type: string
              description: base64 JSON of the x402 SettleResponse (settlement receipt)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - received
                  provenance:
                    $ref: '#/components/schemas/Provenance'
        '400':
          description: Validation error (text missing or too long, invalid category or email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: 'Payment required: send accepts[0] ($0.10 USDC on Base) with an x402-capable client
            and retry the same request with a PAYMENT-SIGNATURE header. The PAYMENT-REQUIRED response
            header carries the same x402 PaymentRequired object base64-encoded, without the app-level
            message field (which is body-only).'
          headers:
            PAYMENT-REQUIRED:
              schema:
                type: string
              description: base64 JSON of the x402 PaymentRequired object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'
              example:
                x402Version: 2
                accepts:
                - scheme: exact
                  network: eip155:8453
                  asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
                  amount: '100000'
                  payTo: '0x0000000000000000000000000000000000000000'
                  maxTimeoutSeconds: 300
                  extra:
                    name: USD Coin
                    version: '2'
                resource:
                  url: https://x402-list.com/api/v1/suggestions
                  description: Suggestion fee for x402 List directory feedback
                  mimeType: application/json
                  serviceName: x402 List
                error: suggestion_fee_required
                message: 'Posting a suggestion to the x402 List directory requires a $0.10 x402 payment
                  on Base (USDC). Pay with an x402-capable client: send the request again with a PAYMENT-SIGNATURE
                  header. See https://x402-list.com/api for the flow.'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The payment layer is not configured, so the suggestion box is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /best:
    get:
      operationId: getBestServices
      summary: Recommend the best x402 service(s) for a need
      description: Ranks the directory and returns the best x402 service(s) for a stated need, in one
        request (no paging). The ranking is the same two-stage relevance-then-quality scoring the MCP
        x402_find_best_service tool uses, run server-side. It is scored mostly on per-service reliability
        (live status, verification, uptime, response time), x402 compliance, and price (USD), filtered
        by category and network, with a SMALL (about 10%) weight on on-chain traction (settlement volume,
        transaction count, and unique buyers measured per service over its known payTo via recognized
        settlers, a conservative undercount). A deterministic danger flag removes a service from this
        surface entirely (its slug is listed in excluded_danger); a residual warning is penalized but
        kept. When a free-text q is given, each candidate is also scored on how well the query matches
        its AI-derived capability tags and summary plus its name/description/category (falling back to
        a plain substring match). The x402 compliance term is the share of deterministic conformance checks
        the service passes, capped at 0.6 (the floor of the C band) when at least one of its EVM routes
        is missing the EIP-712 domain parameters a standard x402 client needs in order to sign a payment.
        That cap is a statement about the payment envelope, not about the merit of the service, and it
        is what moved the scoring to generation 2. The generation served today is 3, which also gates
        the on-chain traction term on an absolute 30-day volume floor, discounts a payout concentrated
        on one buyer, and scores a service that publishes no payTo as zero instead of renormalizing around
        it. Scores produced under an earlier generation are not comparable with these; meta.ranking_version
        on every response says which one produced it. This endpoint is free and metered like every other
        GET on /api/v1/* (beyond the free daily quota it answers 402; see the metering note). Prices are
        decimal US dollars.
      tags:
      - Recommender
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Free-text need description, matched against each service name/description/category
          plus its AI-derived capability tags and summary.
      - name: category
        in: query
        schema:
          type: string
          enum:
          - AI
          - Blockchain
          - Compute
          - Content
          - Data
          - Finance
          - Other
          - Verification
        description: Desired service category from the closed category set (case-insensitive). A value
          outside the set returns 400; omit for all.
      - name: network
        in: query
        schema:
          type: string
        description: Required network name or abbreviation, e.g. "Base" or "BSE". A value outside the
          known network set returns 400.
      - name: max_price_usd
        in: query
        schema:
          type: number
          minimum: 0
        description: Cap on min_price_usd in US dollars; a service priced cheaper or equal passes (a service
          with no known price is excluded).
      - name: require_verified
        in: query
        schema:
          type: boolean
          default: false
        description: 'If true, only FORTE-tier verified services are eligible (treno D3: a paid delivery-probe
          settled and delivered, drift-revocable; the payment-ready base tier is NOT included). A hard
          filter on the eligible pool, not a scoring input, so it does not change ranking_version. A value
          other than true/false returns 400.'
      - name: prefer
        in: query
        schema:
          type: string
          enum:
          - balanced
          - cheapest
          - fastest
          - most_reliable
          default: balanced
        description: Tie-breaking emphasis for the ranking weights. A value outside the enum returns 400.
      - name: limit
        in: query
        schema:
          type: integer
          default: 5
          minimum: 1
          maximum: 20
        description: How many ranked recommendations to return (clamped to 1-20).
      - name: include_facilitator_context
        in: query
        schema:
          type: boolean
          default: false
        description: If true, also return top facilitators by 7d settlement volume as separate ecosystem
          context (NOT per-service). A value other than true/false returns 400.
      responses:
        '200':
          description: Ranked recommendations plus the ranking basis and any danger-excluded slugs. meta.ranking_version
            pins the scoring generation.
          headers:
            X-Meter-Remaining:
              $ref: '#/components/headers/MeterRemaining'
            X-Meter-Reset:
              $ref: '#/components/headers/MeterReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BestResult'
                  meta:
                    type: object
                    properties:
                      ranking_version:
                        type: integer
                        description: 'Scoring generation; bumps when the ranking math or its weights change.
                          Currently 3: the compliance term carries the signability cap described above
                          (generation 2) and the traction term carries an absolute volume floor with a
                          single-buyer discount (generation 3). Pin it if you compare scores over time.'
                  provenance:
                    $ref: '#/components/schemas/Provenance'
              example:
                data:
                  recommendations:
                  - rank: 1
                    slug: weather-x402
                    name: Weather x402
                    category: Data
                    status: online
                    verified: true
                    payment_ready: true
                    uptime_24h: 100
                    avg_response_time_ms: 120
                    min_price_usd: 0.01
                    price_max_usd: 0.01
                    category_percentile_max: 10
                    distinct_price_count: 1
                    networks:
                    - BSE
                    endpoint_count: 2
                    compliance_grade: A
                    compliance_failed_checks: []
                    risk_level: clean
                    capability_tags:
                      value:
                      - weather
                      - forecast
                      confidence: 0.9
                      source: ai
                    traction_status: measured
                    volume_usd_30d: 42.5
                    unique_buyers_30d: 7
                    shared_payout: false
                    top_buyer_share_30d: 0.3
                    score: 0.82
                    relevance: 1
                    quality: 0.79
                    why: online, verified, 100% 24h uptime, 120ms, $0.01 min price, compliance A
                  ranking_basis: Two stages. (1) RELEVANCE ... (2) QUALITY ...
                  excluded_danger: []
                  facilitator_context: null
                meta:
                  ranking_version: 3
        '400':
          description: Invalid parameter (prefer, require_verified, include_facilitator_context, max_price_usd,
            category, or a network outside the known set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          $ref: '#/components/responses/MeteredPaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /assess:
    post:
      operationId: postAssess
      summary: On-demand paid AI assessment of a service shortlist
      description: 'Runs a FRESH flagship-LLM comparison of an already-assessed shortlist of services
        for a stated need, and charges x402 only for that fresh reasoning. It never charges to read an
        already-computed assessment (that stays free on the service detail). The report is a modular envelope:
        data carries one block per priced module (today the advisor answer under data.answer), and meta
        carries report_version and the modules_run list, so future modules are additive and never breaking.
        The paid flow is the standard x402 handshake: the first call (no PAYMENT-SIGNATURE) returns HTTP
        402 with a PAYMENT-REQUIRED header and an accepts[] body (single option, $0.25 USDC on Base);
        sign the payment and retry the same request with a PAYMENT-SIGNATURE header. On success the 200
        carries a PAYMENT-RESPONSE header. You may optionally include a probe target (probe { slug, endpoint_path?
        }) to also test one listed service live: after the fresh reasoning the server makes a real x402
        payment to that endpoint and analyzes the response, and the single accepts[0] amount is then $0.25
        plus that endpoint price X. The report then carries a probe_report block with a verdict plus truncated
        extracts (never the verbatim third-party body). The probe is only offered when live probing is
        armed, and probe fees are non-refundable regardless of outcome. If the fresh run cannot be produced
        (an unresolvable shortlist or a model miss) the endpoint answers 503 BEFORE settling, so the caller
        is never charged. When the payment layer or the on-demand assessment feature is not configured,
        the endpoint answers 503. There is NO refund. This endpoint is agent-first (JSON only).'
      tags:
      - Assess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessRequest'
            example:
              question: Which of these is the cheapest reliable weather API for a high-volume agent?
              services:
              - weather-x402
              - forecast-api
              - meteo-402
      responses:
        '200':
          description: The modular assessment report. data.answer is the AI-marked recommendation; meta
            carries report_version and modules_run. The PAYMENT-RESPONSE header carries the settlement
            receipt.
          headers:
            PAYMENT-RESPONSE:
              schema:
                type: string
              description: base64 JSON of the x402 SettleResponse (settlement receipt)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssessReport'
                  meta:
                    type: object
                    properties:
                      report_version:
                        type: integer
                        description: Report contract generation; bumps when the envelope or a module block
                          shape changes.
                      modules_run:
                        type: array
                        items:
                          type: string
                        description: Ids of the priced modules that ran (e.g. ["advisor"]).
                  provenance:
                    $ref: '#/components/schemas/Provenance'
              example:
                data:
                  answer:
                    question: Which of these is the cheapest reliable weather API for a high-volume agent?
                    recommendation:
                      value: 'weather-x402 fits best: lowest price and highest measured uptime of the
                        three.'
                      confidence: 0.72
                      source: ai
                    ranking:
                    - slug: weather-x402
                      reason: lowest price at $0.01 with 100% 24h uptime
                    - slug: forecast-api
                      reason: comparable reliability but a higher price tier
                    model: glm-5.2
                    prompt_version: f2-advisor-1
                    candidates_considered: 3
                    note: AI-generated from the measured signals of the listed services. Not an endorsement;
                      verify pricing and payTo before paying.
                meta:
                  report_version: 1
                  modules_run:
                  - advisor
        '400':
          description: Validation error (question missing or too long, or services not a non-empty array
            of at most 8 valid slugs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: 'Payment required: pay accepts[0] ($0.25 USDC on Base) with an x402-capable client
            and retry the same request with a PAYMENT-SIGNATURE header; the successful response then carries
            a PAYMENT-RESPONSE header. The PAYMENT-REQUIRED response header carries the same x402 PaymentRequired
            object base64-encoded. When the request includes a probe target and live probing is armed,
            the single accepts[0] amount is $0.25 plus the probed endpoint price X instead.'
          headers:
            PAYMENT-REQUIRED:
              schema:
                type: string
              description: base64 JSON of the x402 PaymentRequired object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'
              example:
                x402Version: 2
                accepts:
                - scheme: exact
                  network: eip155:8453
                  asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
                  amount: '250000'
                  payTo: '0x0000000000000000000000000000000000000000'
                  maxTimeoutSeconds: 300
                  extra:
                    name: USD Coin
                    version: '2'
                resource:
                  url: https://x402-list.com/api/v1/assess
                  description: 'On-demand x402 List assessment: a fresh AI comparison of the requested
                    services for your need'
                  mimeType: application/json
                  serviceName: x402 List
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The payment layer or the on-demand assessment feature is not configured, so the
            endpoint is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ServiceListItem:
      type: object
      description: A service in the directory listing with computed summary fields
      properties:
        slug:
          type: string
          description: URL-friendly identifier
          example: weather-x402
        name:
          type: string
          example: Weather x402
        description:
          type: string
        base_url:
          type: string
          format: uri
        website_url:
          type:
          - string
          - 'null'
          format: uri
        category:
          type: string
          example: Data
        source:
          type: string
          enum:
          - submitted
          - imported:bazaar
          - imported:x402scan
          description: 'Provenance (D4): how this listing entered the directory. "submitted" = an operator
            or user submitted it through /submit; "imported:<origin>" = auto-imported from a public x402
            index (not an operator endorsement). An operator can claim and correct an imported listing
            through the owner-update flow at /services/{slug}/update.'
          example: submitted
        status:
          type: string
          enum:
          - online
          - degraded
          - offline
          - unknown
        verified:
          type: boolean
          description: 'FORTE tier (treno D3): a paid delivery-probe settled on-chain and delivered AND
            the badge was not since revoked on payTo/schema drift. No time decay. SEMANTIC CHANGE: this
            field previously carried the broad "answers a valid 402 and is alive" signal, which is now
            payment_ready.'
        payment_ready:
          type: boolean
          description: 'BASE tier (treno D3): the endpoint answered a valid x402 402 challenge and is
            alive within the decay window (a probe success within the last 7 days, or api-key exempt).
            The broad discovery signal the verified field used to carry.'
        endpoint_count:
          type: integer
          description: Number of active endpoints
        min_price_usd:
          type:
          - number
          - 'null'
          description: Lowest price in USD across all endpoints
        networks:
          type: array
          items:
            type: string
          description: Network abbreviations supported by this service (e.g. ["BSE", "SOL"])
        networks_caip2:
          type: array
          items:
            type: string
          description: Canonical CAIP-2 identifiers for cross-endpoint joins, index-aligned with networks
            (e.g. ["eip155:8453", "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"]). Falls back to the stored
            network id for networks not yet in the canonical map, mirroring /networks .caip2, so service-to-network
            joins never silently break
        uptime_24h:
          type:
          - number
          - 'null'
          description: Uptime percentage over last 24 hours; null = not yet monitored (no checks recorded
            in the window)
        avg_response_time_ms:
          type:
          - integer
          - 'null'
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        assessment:
          description: Compact per-service assessment summary (evidence-backed). null until the service
            is first assessed. Measured sub-scores are plain values; capability_tags and summary are AI-derived
            and carry {value,confidence,source:"ai"} provenance so an AI guess is never mistaken for a
            measured fact.
          oneOf:
          - $ref: '#/components/schemas/AssessmentSummary'
          - type: 'null'
    ServiceDetail:
      type: object
      description: Full service detail including endpoints with pricing
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        base_url:
          type: string
          format: uri
        website_url:
          type:
          - string
          - 'null'
          format: uri
        category:
          type: string
        endpoint_count:
          type: integer
          description: Number of active endpoints
        min_price_usd:
          type:
          - number
          - 'null'
          description: Lowest price in USD across all endpoints
        uptime_24h:
          type:
          - number
          - 'null'
          description: Uptime percentage over last 24 hours; null = not yet monitored (no checks recorded
            in the window)
        source:
          type: string
          enum:
          - submitted
          - imported:bazaar
          - imported:x402scan
          description: 'Provenance (D4): how this listing entered the directory. "submitted" = an operator
            or user submitted it through /submit; "imported:<origin>" = auto-imported from a public x402
            index (not an operator endorsement). An operator can claim and correct an imported listing
            through the owner-update flow at /services/{slug}/update.'
          example: submitted
        status:
          type: string
          enum:
          - online
          - degraded
          - offline
          - unknown
        verified:
          type: boolean
          description: 'FORTE tier (treno D3): a paid delivery-probe settled on-chain and delivered AND
            the badge was not since revoked on payTo/schema drift. It has NO time-based decay - it decays
            one-way through the monitor drift hook and re-earns only by paying again. SEMANTIC CHANGE:
            this field previously carried the broad "answers a valid 402 and is alive" signal, which is
            now payment_ready. Starts empty and grows only with real payments, so it can be false for
            a service that is very much alive.'
        verified_until:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Always null: the FORTE verified tier has no time-based expiry (it decays on payTo/schema
            drift, not on a timer). Read payment_ready_until for the payment-ready decay clock. Retained
            for shape stability.'
        payment_ready:
          type: boolean
          description: 'BASE tier (treno D3): the endpoint answered a valid x402 402 challenge and is
            alive within the decay window (a probe success within the last 7 days, or api-key exempt).
            Ages back to false past the window and heals on the next good probe; the historical fact is
            never erased. This is the broad discovery signal verified used to carry.'
        payment_ready_until:
          type:
          - string
          - 'null'
          format: date-time
          description: When the payment-ready tier decays if no further successful probe lands (last_success_at
            + 7 days); null when the service was never observed up.
        last_success_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent time the monitor observed a successful 402 probe; null when never observed
            up.
        consecutive_failures:
          type: integer
          minimum: 0
          description: Number of consecutive failed checks; 0 when the service is stable. Internal negative
            monitor sentinels are clamped to 0.
        check_interval_minutes:
          type: integer
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        uptime:
          type: object
          description: Uptime percentage per trailing window; each window is null when the service has
            not been monitored yet (null = not yet monitored, 0 = observed down)
          properties:
            24h:
              type:
              - number
              - 'null'
              description: null = not yet monitored
            7d:
              type:
              - number
              - 'null'
              description: null = not yet monitored
            30d:
              type:
              - number
              - 'null'
              description: null = not yet monitored
            90d:
              type:
              - number
              - 'null'
              description: null = not yet monitored
        avg_response_time_ms:
          type:
          - integer
          - 'null'
        total_checks:
          type: integer
        networks:
          type: array
          items:
            type: string
          description: Network abbreviations aggregated across all active endpoints
        networks_caip2:
          type: array
          items:
            type: string
          description: Canonical CAIP-2 identifiers for cross-endpoint joins, index-aligned with networks.
            Falls back to the stored network id for networks not yet in the canonical map, mirroring /networks
            .caip2
        asset:
          type: string
          description: Primary payment asset (e.g. USDC)
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        assessment:
          description: 'Full evidence-backed per-service assessment (T1, free): reliability, x402 compliance,
            site/docs reachability, domain/identity, economics, deterministic risk, plus an AI synthesis.
            null until the service is first assessed. Measured families are read-only plain values; synthesis
            fields are AI-derived and marked {value,confidence,source:"ai"}, and a computed value never
            overrides a measured one.'
          oneOf:
          - $ref: '#/components/schemas/Assessment'
          - type: 'null'
    Endpoint:
