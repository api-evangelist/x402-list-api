    AiMarkedField:
      type: object
      description: An AI-derived (assessment family 10) field with its own provenance. value may be "unknown"
        when the model could not ground it in the measured signals. Never overrides a measured value.
      properties:
        value:
          description: The AI-derived value (string or array of strings), or "unknown"
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Model confidence 0-1
        source:
          type: string
          enum:
          - ai
    AssessmentSummary:
      type: object
      description: Compact per-service assessment summary carried on each list item (backs relevance/quality
        ranking). Measured sub-scores are plain; capability_tags/summary are AI-derived and marked.
      properties:
        compliance_grade:
          type:
          - string
          - 'null'
          enum:
          - A
          - B
          - C
          - D
          - F
          - unknown
          - null
          description: 'x402 conformance grade over the deterministic checklist (the share of evaluable
            checks the service passes). One ceiling applies: a service with at least one EVM route missing
            the EIP-712 domain parameters a standard x402 client needs in order to sign (check eip712_domain_extra
            = false) does not grade above C, however clean the rest of the envelope is. "unknown" means
            nothing has been observed yet, which is not a failure.'
        compliance_passed:
          type:
          - integer
          - 'null'
          description: How many of the evaluable checks passed
        compliance_total:
          type:
          - integer
          - 'null'
          description: 'How many checks could be evaluated at all: the denominator of the grade, up to
            14. It is lower when a check does not apply (a Solana-only service has no EVM entry for the
            EIP-712 domain check) or could not be observed; a not-evaluable check is never counted as
            a failure'
        compliance_failed_checks:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Machine-stable ids of the conformance checks that failed (pass=false); [] = all
            pass, null = no compliance graded. Human labels are in the detail assessment.compliance.checks[].
            The three signability ids are eip712_domain_extra (at least one EVM route carries no EIP-712
            domain parameters, so a standard x402 client cannot sign a payment for it), x402_version_current
            (a captured payload declares an x402 version other than the current 2) and version_channel_coherent
            (an envelope declaring x402 version 2 was delivered only in the response body, not in the
            payment-required header). Only eip712_domain_extra caps the grade; the other two are facts
            about the envelope that do not stop a payment from being signed
        reliability_uptime_30d:
          type:
          - number
          - 'null'
          description: Measured 30d uptime percentage; null = not yet measured
        response_p95_ms:
          type:
          - integer
          - 'null'
        price_usd:
          type:
          - number
          - 'null'
          description: Decimal USD (entry / min price)
        category_percentile:
          type:
          - number
          - 'null'
          description: 0-100 within its category, ranked on the min price (lower = cheaper)
        price_stability:
          type:
          - number
          - 'null'
          description: 0-1, 1 = price never moved
        price_max_usd:
          type:
          - number
          - 'null'
          description: Decimal USD (highest tier); equals price_usd when flat. null on rows assessed before
            this field existed
        category_percentile_max:
          type:
          - number
          - 'null'
          description: 0-100, ranked on the max price among every service max price in the category
        endpoint_count:
          type:
          - integer
          - 'null'
          description: Count of active priced endpoints
        distinct_price_count:
          type:
          - integer
          - 'null'
          description: Count of distinct current prices (1 = flat, >1 = tiered)
        risk_level:
          type:
          - string
          - 'null'
          enum:
          - clean
          - warning
          - danger
          - null
          description: Deterministic risk banner level
        capability_tags:
          description: AI-derived capability tags, marked {value,confidence,source:"ai"}; null when the
            model could not ground them
          oneOf:
          - $ref: '#/components/schemas/AiMarkedField'
          - type: 'null'
        summary:
          description: AI-derived one-line summary, marked {value,confidence,source:"ai"}; null when unknown
          oneOf:
          - $ref: '#/components/schemas/AiMarkedField'
          - type: 'null'
        traction:
          description: Family 6 measured on-chain traction (same block as the detail); null on rows assessed
            before this field existed
          oneOf:
          - $ref: '#/components/schemas/Traction'
          - type: 'null'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
    Assessment:
      type: object
      description: Full evidence-backed per-service assessment. Measured families are read-only plain
        values; the synthesis block is AI-derived and marked. "unknown"/null are honest, not zero.
      properties:
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        input_hash:
          type:
          - string
          - 'null'
          description: Hash of the normalized inputs the assessment was computed over
        model_id:
          type:
          - string
          - 'null'
          description: LLM model id used for the synthesis block (null when no synthesis ran)
        prompt_version:
          type:
          - string
          - 'null'
        reliability:
          type:
          - object
          - 'null'
          description: 'Family 1: uptime windows, p95/avg response, freshness, failures, total checks
            (measured)'
        compliance:
          type:
          - object
          - 'null'
          description: 'Family 2: x402 conformance grade + per-check ok/x list (14 checks, of which three
            cover signability: the declared x402 version, the EIP-712 domain parameters on every EVM entry,
            and whether a v2 envelope travelled in the payment-required header), payTo source/location
            (deterministic). Each check is true, false, or null when it could not be evaluated, and a
            null never counts as a failure'
        site:
          type:
          - object
          - 'null'
          description: 'Family 3: homepage/openapi/pricing/llms.txt/robots/terms reachability (measured)'
        domain:
          type:
          - object
          - 'null'
          description: 'Family 4: domain age, registrar, free-host flag (measured)'
        economics:
          type:
          - object
          - 'null'
          description: 'Family 5 (measured): entry price (min USD + atomic) and its in-category percentile,
            plus the full price picture for tiered services: price_max_usd (highest tier), category_percentile_max,
            endpoint_count, distinct_price_count, pricing model and stability'
        risk:
          type:
          - object
          - 'null'
          description: 'Family 8: deterministic risk level + flags (blocklist/impersonation only; never
            AI, never from low uptime or high price)'
        synthesis:
          type:
          - object
          - 'null'
          description: 'Family 10: AI-derived summary/capability_tags/category/inputs/outputs/auth, each
            an AiMarkedField {value,confidence,source:"ai"}; never overrides a measured value'
        traction:
          description: 'Family 6: measured on-chain settlement traction (volume/buyers/concentration over
            the payTo mapping, USDC, a conservative undercount); null on rows assessed before this field
            existed'
          oneOf:
          - $ref: '#/components/schemas/Traction'
          - type: 'null'
    PricePoint:
      type: object
      description: One captured 402 price observation for a service, at one endpoint/network/asset
      properties:
        recorded_at:
          type: string
          format: date-time
          description: UTC timestamp (ISO 8601, Z-format)
        price_usd:
          type:
          - number
          - 'null'
          description: Decimal USD at that observation
        endpoint_id:
          type: string
        network:
          type: string
          description: Network id the price was recorded on
        asset_address:
          type:
          - string
          - 'null'
          description: Token address; null = unknown/not reported
    ScorePoint:
      type: object
      description: 'One assessment run projected to its measured sub-scores (the sub-scores only: no ranked
        composite score, no AI-derived fields)'
      properties:
        recorded_at:
          type:
          - string
          - 'null'
          format: date-time
        compliance_grade:
          type:
          - string
          - 'null'
          enum:
          - A
          - B
          - C
          - D
          - F
          - unknown
          - null
        compliance_passed:
          type:
          - integer
          - 'null'
          description: Checks passed at that run
        compliance_total:
          type:
          - integer
          - 'null'
          description: 'Checks evaluable at that run: the denominator AS MEASURED then, which is why it
            must be read per point. It moved from 11 to 14 when the signability checks landed, and older
            points are left as they were recorded'
        uptime_24h:
          type:
          - number
          - 'null'
        uptime_30d:
          type:
          - number
          - 'null'
        response_p95_ms:
          type:
          - integer
          - 'null'
    VolumePoint:
      type: object
      description: One UTC-day bucket of measured on-chain settlement volume for a service (USDC, settler-attributed;
        a conservative undercount)
      properties:
        date:
          type: string
          description: UTC day (YYYY-MM-DD)
          example: '2026-07-06'
        volume_usd:
          type: number
          description: Settlement volume in USD observed that day
        tx_count:
          type: integer
          description: Settlement count observed that day
    BuyersPoint:
      type: object
      description: One UTC-day bucket of the distinct on-chain buyers a service settled with (counted
        from the raw settlements, not summed from a rollup)
      properties:
        date:
          type: string
          description: UTC day (YYYY-MM-DD)
          example: '2026-07-06'
        unique_buyers:
          type: integer
          description: Distinct buyer addresses observed settling that day
    Traction:
      type: object
      description: 'Family 6: measured on-chain traction snapshot for a service, derived deterministically
        from settler-attributed USDC settlements over the service payTo mapping. null != 0: status "measured"
        reports real numbers (0 is an honest "never settled on-chain via a facilitator"); "no-payto" (no
        known payTo) and "unmeasured-network" (payTo only on a network we do not measure) null every metric
        rather than fake a zero; "unresponsive" suppresses the numbers of a shared-payout member whose
        probe has been failing for 7 days (settlements on the shared address are not attributed to it
        while it is down). A conservative undercount. shared_payout marks a payTo shared across services:
        volume_usd_30d is then attributed PRO-QUOTA (the operator-level figure divided by the current
        members sharing the payout), a declared convention rather than an individually observed measure,
        while tx_count_30d and unique_buyers_30d stay WHOLE operator-level integers, never divided or
        fractional; the ratios top_buyer_share_30d and trend_7d_vs_30d are left whole.'
      properties:
        status:
          type: string
          enum:
          - measured
          - no-payto
          - unmeasured-network
          - unresponsive
          description: Whether the metrics are measured, and if not, why they are null
        volume_usd_30d:
          type:
          - number
          - 'null'
          description: Settlement volume in USD over the trailing 30 UTC days; null unless status is measured.
            On a shared payout it is attributed pro-quota (the address total divided by the services sharing
            it), so the block sums correctly across services; the daily /volume series stays address-level,
            do not sum THAT across shared-payout services.
        tx_count_30d:
          type:
          - number
          - 'null'
          description: Settlement count over the trailing 30 UTC days; null unless measured. On a shared
            payout it stays a WHOLE operator-level integer, never divided (apply pro_quota_share for the
            nominal per-service slice), so never sum it across services that share a payout.
        unique_buyers_30d:
          type:
          - number
          - 'null'
          description: Distinct buyer addresses over the trailing 30 UTC days; null unless measured. On
            a shared payout it stays a WHOLE operator-level integer, never divided or fractional (apply
            pro_quota_share for the nominal slice), so never sum it across services that share a payout.
        last_settlement_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent observed settlement across all history; null unless measured
        top_buyer_share_30d:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          description: 0-1 share of the single largest buyer over 30d (concentration); null when 30d volume
            is 0 or not measured
        trend_7d_vs_30d:
          type:
          - number
          - 'null'
          description: Ratio of the last-7d daily rate to the 30d daily rate; null when 30d volume is
            0 or not measured
        shared_payout:
          type: boolean
          description: A current payTo of this service is also a current payTo of another service; when
            true only volume_usd_30d is attributed pro-quota, while the counting metrics stay whole operator-level
            integers
        shared_with:
          type: integer
          minimum: 0
          description: Count of OTHER services sharing a current payTo (0 when not shared); the pro-quota
            divisor is shared_with + 1
        pro_quota_share:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          description: 'Cluster fraction 1/(shared_with + 1): the pro-quota slice to apply to the whole-integer
            counts (tx_count_30d, unique_buyers_30d, tx_count_all_time) for this service nominal portion
            of a shared payout. 1 on a dedicated (unshared) payout; null unless status is measured.'
        measured_networks:
          type: array
          items:
            type: string
          description: Canonical CAIP-2 networks that contributed a measurement
        first_settlement_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'TRENO A additive: first observed on-chain settlement over the payTo mapping; null
            unless measured (never recorded yet). null on a snapshot stored before this field existed.'
        volume_usd_all_time:
          type:
          - number
          - 'null'
          description: 'TRENO A additive: settlement volume in USD over all recorded history since listing.
            Attributed PRO-QUOTA on a shared payout, exactly like volume_usd_30d (all-time over a shared
            address is still the operator figure divided by the sharing services). null unless measured,
            or on a pre-extension snapshot.'
        tx_count_all_time:
          type:
          - number
          - 'null'
          description: 'TRENO A additive: settlement count over all recorded history. On a shared payout
            it stays a WHOLE operator-level integer, never divided or fractional, like tx_count_30d (apply
            pro_quota_share for the nominal slice; only volume_usd_all_time is pro-quota). null unless
            measured, or on a pre-extension snapshot.'
        median_settlement_usd_30d:
          type:
          - number
          - 'null'
          description: 'TRENO A additive: median single-settlement amount (USD) over the trailing 30 days.
            An invariant per-settlement amount, NEVER divided pro-quota. null unless measured, or on a
            pre-extension snapshot.'
        max_settlement_usd_30d:
          type:
          - number
          - 'null'
          description: 'TRENO A additive: largest single-settlement amount (USD) over the trailing 30
            days. An invariant per-settlement amount, NEVER divided pro-quota. null unless measured, or
            on a pre-extension snapshot.'
        settled_via:
          type: array
          items:
            type: string
          description: 'TRENO A additive (D1): facilitator ids that settled this service on-chain over
            the trailing 30 days, ordered by volume. [] when not measured or on a pre-extension snapshot.
            An invariant fact, never divided.'
        settled_via_detail:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              volume_usd_30d:
                type: number
              tx_count_30d:
                type: integer
          description: 'A-26#2 additive: settled_via WITH the per-facilitator 30d volume/tx weights, same
            order as settled_via. [] when not measured or on a pre-extension snapshot. Invariant facts,
            never divided.'
        shared_with_services:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
          description: 'TRENO A additive (E4): the other listed services currently sharing this payout
            address (slug + name), for the pro-quota disclosure. [] when the payout is not shared or on
            a pre-extension snapshot. An invariant fact, never divided.'
        caveat:
          type: string
          description: 'Fixed in-band note: the conservative undercount, plus the pro-quota convention
            when the payout is shared'
        all_time_caveat:
          type: string
          description: 'A-25#2 additive: fixed in-band note that first_settlement_at / volume_usd_all_time
            / tx_count_all_time are floored at the start of our harvest window (the fixed backfill floor,
            differing per chain), not the service full history.'
    CheckEntry:
      type: object
      description: A single monitoring check result
      properties:
        id:
          type: string
          format: uuid
        checked_at:
          type: string
          format: date-time
        response_time_ms:
          type:
          - integer
          - 'null'
        status_code:
          type:
          - integer
          - 'null'
        is_up:
          type: boolean
        error_message:
          type:
          - string
          - 'null'
        endpoints_found:
          type: integer
    GlobalCheckEntry:
      type: object
      description: A check entry with service info, for the global live feed
      properties:
        id:
          type: string
          format: uuid
        checked_at:
          type: string
          format: date-time
        is_up:
          type: boolean
        response_time_ms:
          type:
          - integer
          - 'null'
        status_code:
          type:
          - integer
          - 'null'
        endpoints_found:
          type: integer
        service_name:
          type: string
        service_slug:
          type: string
        service_status:
          type: string
          enum:
          - online
          - degraded
          - offline
          - unknown
    CanonicalAccept:
      type: object
      description: One canonical accepts[] entry captured from the live 402 wire, tied to the endpoint
        it was observed on. Field names are the stored snapshot shape (camelCase), passed through verbatim.
      properties:
        endpoint:
          type: string
          description: The probed endpoint as "METHOD /path"
          example: GET /v1/generate
        scheme:
          type: string
          example: exact
        network:
          type: string
          description: CAIP-2 network id
          example: eip155:8453
        asset:
          type: string
          description: Token contract address, verbatim
          example: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
        assetName:
          type: string
          example: USDC
        payTo:
          type: string
          description: Receiving wallet address, verbatim (Solana base58 is case-significant, never lowercased)
        price:
          type: string
          description: Atomic price as a string
          example: '10000'
        mimeType:
          type:
          - string
          - 'null'
        x402Version:
          type:
          - integer
          - 'null'
    ChangeSummary:
      type: object
      description: 'Precomputed diff for the event. Fields are populated per event type: payto_changed
        carries the payTo deltas, price_changed carries priceChanges, schema_changed carries the schema/endpoint
        deltas. An absent field means no change of that kind.'
      properties:
        payToAdded:
          type: array
          items:
            type: string
        payToRemoved:
          type: array
          items:
            type: string
        priceChanges:
          type: array
          items:
            type: object
            properties:
              endpoint:
                type: string
              network:
                type: string
              assetName:
                type: string
              oldPrice:
                type: string
                description: Comma-joined distinct old prices under this endpoint/scheme/network/asset
                  key
              newPrice:
                type: string
                description: Comma-joined distinct new prices under the same key
        endpointsAdded:
          type: array
          items:
            type: string
        endpointsRemoved:
          type: array
          items:
            type: string
        schemaAdded:
          type: array
          items:
            type: string
        schemaRemoved:
          type: array
          items:
            type: string
    ServiceChangeEvent:
      type: object
      description: A change detected on a service live 402 wire, joined to the service it belongs to.
      properties:
        slug:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - payto_changed
          - price_changed
          - schema_changed
          description: 'What moved: payTo (settlement address) rotation, price move, or schema change.'
        observed_at:
          type: string
          format: date-time
        summary:
          oneOf:
          - $ref: '#/components/schemas/ChangeSummary'
          - type: 'null'
        old_snapshot:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CanonicalAccept'
          description: Canonical accepts[] before the change; null on a first observation.
        new_snapshot:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CanonicalAccept'
          description: Canonical accepts[] after the change.
    StatusSummary:
      type: object
      properties:
        total:
          type: integer
        online:
          type: integer
        degraded:
          type: integer
        offline:
          type: integer
        unknown:
          type: integer
        services:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              status:
                type: string
                enum:
                - online
                - degraded
                - offline
                - unknown
              last_checked_at:
                type:
                - string
                - 'null'
                format: date-time
              consecutive_failures:
                type: integer
                minimum: 0
                description: Number of consecutive failed checks; 0 when the service is stable. Internal
                  negative monitor sentinels are clamped to 0.
              uptime_24h:
                type:
                - number
                - 'null'
                description: Uptime percentage over the latest daily snapshot; null = not yet monitored
              avg_response_time_ms:
                type:
                - number
                - 'null'
    Network:
      type: object
      description: A blockchain network that x402 services accept payments on
      properties:
        id:
          type: string
          format: uuid
        caip2_id:
          type: string
          description: CAIP-2 chain identifier as stored (may be lowercase, e.g. the Solana reference);
            kept for backwards compatibility. Prefer caip2 for joins.
          example: eip155:8453
        caip2:
          type: string
          description: Canonical CAIP-2 identifier for cross-endpoint joins (exact casing, Solana reference
            truncated to 32 chars). Matches network_caip2 in service pricing and facilitator chains. Falls
            back to caip2_id for networks not yet in the canonical map.
          example: eip155:8453
        name:
          type: string
          example: Base
        abbreviation:
          type: string
          example: BSE
        chain_type:
          type: string
          example: evm
        is_mainnet:
          type: boolean
        explorer_url:
          type: string
          format: uri
        service_count:
          type: integer
          description: Number of services accepting payments on this network
        avg_uptime:
          type: number
          description: Per-service mean of the latest daily uptime rollup for services on this network
            (see meta.avg_uptime_method)
    AggregateStats:
      type: object
      description: Aggregate statistics about the x402 ecosystem
      properties:
        total_services:
          type: integer
        total_endpoints:
          type: integer
        total_networks:
          type: integer
          description: Count of distinct networks that carry current pricing on an active endpoint, recomputed
            live from the pricing rows. Networks the reference table classifies as testnet are excluded;
            a chain not yet in the reference table still counts. The networks[] array is built by an inner
            join on the reference table and omits chains absent from it, so networks[] can be SHORTER
            than this count (not longer) when live pricing spans chains the reference table has not yet
            catalogued.
        total_networks_note:
          type: string
          description: Human-readable reminder of the total_networks semantics served in-band with the
            response
        avg_uptime_24h:
          type: number
        avg_uptime_7d:
          type: number
        avg_uptime_method:
          type: string
          description: How per-network avg_uptime is computed. Identical to the method used by /networks.
        avg_response_time_ms:
          type: integer
        checks_per_hour:
          type: integer
        pricing:
          type: object
          properties:
            avg_price_usd:
              type: number
            min_price_usd:
              type: number
            max_price_usd:
              type: number
            median_price_usd:
              type: number
        networks:
          type: array
          items:
            type: object
            properties:
              abbreviation:
                type: string
              is_mainnet:
                type: boolean
              service_count:
                type: integer
              avg_uptime:
                type: number
        traction:
          type: object
          description: 'Measured on-chain traction aggregated across ALL listed services over the last
            30 days. Computed directly over the raw settlements, deduplicated on settlement identity (network,
            tx_hash, log_index), and NEVER summed from the per-service assessment.traction figures (distinct
            buyers are not additive across services, and summing pro-quota volume would reintroduce shared-attribution
            rounding). USDC only, via measured facilitators: a measured floor across the listed directory,
            not an ecosystem total.'
          properties:
            unique_buyers_30d:
              type:
              - integer
              - 'null'
              description: Distinct on-chain buyer addresses across listed services over the trailing
                30 days (deduplicated, not a sum of per-service buyer counts). null until the first hourly
                precompute commits the cache row, never a fake 0.
            volume_usd_30d:
              type:
              - number
              - 'null'
              description: USDC settlement volume across listed services over the trailing 30 days (USD;
                a measured floor, not summed from per-service figures). null until the first hourly precompute,
                never a fake 0.
            settlement_count_30d:
              type:
              - integer
              - 'null'
              description: 'Deduped settlement count across listed services over the trailing 30 days.
                Distinct from any per-service tx_count_30d: this is a count of deduped settlement legs,
                not a sum. null until the first hourly precompute, never a fake 0.'
            measured_services:
              type:
              - integer
              - 'null'
              description: Number of listed services with at least one attributed settlement in the window
                (walks the payTo mapping with the last_seen + 1 day grace). null until the first hourly
                precompute, never a fake 0.
            measured_networks:
              type: array
              items:
                type: string
              description: Network abbreviations settled on in the window (e.g. BSE, SOL). Abbreviations
                here, unlike the per-service traction block which uses CAIP-2 ids. Empty until the first
                hourly precompute.
            coverage_of_measured_flow_pct:
              type:
              - number
              - 'null'
              description: 'Coverage KPI: the listed dedup settlement volume (volume_usd_30d) as a percentage
                of the flow measurable by our tracked settlers over the same 30 days (the facilitator
                daily volume we measure, NOT the whole ecosystem, so it is a floor on our coverage of
                the flow we can see). Precomputed hourly; null until the first refresh (never a fake 0).
                The denominator is also declared in-band in method.'
            measured_flow_freshness:
              type:
              - object
              - 'null'
              description: 'How fresh the flow behind coverage_of_measured_flow_pct is (W2-13#3). Coverage
                says how much of the measurable flow we cover, not whether that flow is still being ingested:
                a settler-sync cursor frozen hours ago keeps serving a coverage figure that looks current.
                Measured at SYNC-GROUP grain (facilitator x network x token), which is the unit that actually
                freezes: a facilitator can sync Base every 15 minutes while its Solana groups have not
                completed in hours, and rolling that up by newest completion would report it as live.
                Always present as a key; null only when the freshness read itself failed at response time
                (the rest of the response still serves). An empty sync state is never null: it reads 0
                of 0, never a fabricated freshness. Aggregate only, and it reports the same sync-state
                table, at the same grain and with the same 2-hour threshold, as the ingest block of GET
                /api/health, which is where the site-level liveness verdict lives.'
              properties:
                oldest_cursor_age_seconds:
                  type:
                  - integer
                  - 'null'
                  description: 'Age, in whole seconds at response time, of the most-behind sync GROUP''s
                    last clean settler-sync completion (not the most-behind facilitator: a partly frozen
                    facilitator is reported by its frozen group, never by its freshest one). null when
                    no tracked group has ever completed a sync (an absence of measurement, never a fresh
                    0); such a group is counted in stale_sync_groups.'
                stale_sync_groups:
                  type: integer
                  description: 'Sync groups whose cursor is frozen past the staleness threshold (2 hours,
                    well above the 15-minute sync cadence) or that never completed a sync. This is the
                    size of the freeze: the settlement flow those groups carry is decaying, so a non-zero
                    value means the coverage figure is computed over a partly stale window.'
                total_sync_groups:
                  type: integer
                  description: 'Settler-sync groups (facilitator x network x token) tracked at all: the
                    denominator for stale_sync_groups.'
                stale_facilitators:
                  type: integer
                  description: 'Facilitators with AT LEAST ONE frozen sync group. Any-stale on purpose:
                    a facilitator counts here as soon as part of its ingest is frozen, even while its
                    other networks keep completing, because the flow it contributes is already partial.
                    Read it next to stale_sync_groups: how many settlement paths are affected, against
                    how much of the ingest.'
                total_facilitators:
                  type: integer
                  description: 'Facilitators carrying a settler-sync state row at all: the denominator
                    for stale_facilitators.'
            top_10_services_share_pct:
              type:
              - number
              - 'null'
              description: 'Concentration disclosure: the share of the 30d dedup volume held by the top
                10 services (ranked by volume via the payTo mapping). The numerator is the deduped settlements
                mapped to any top-10 service, never a sum of the per-service figures; the denominator
                is the same whole-window dedup total (volume_usd_30d). Precomputed hourly; null until
                the first refresh.'
            top_1_service_share_pct:
              type:
              - number
              - 'null'
              description: 'Concentration disclosure one level deeper than top_10: the share of the 30d
                dedup volume held by the SINGLE largest service (ranked by volume via the payTo mapping).
                By construction top_1 <= top_10. Same hourly precompute; null until the first refresh
                (never a fake 0).'
            top_1_service_top_buyer_share_pct:
              type:
              - number
              - 'null'
              description: 'One level deeper again: within that single largest service, the share of ITS
                30d volume held by its own single largest buyer. Same hourly precompute; null until the
                first refresh (never a fake 0).'
            method:
              type: string
              description: 'How the aggregate is computed: dedup on settlement identity, never a sum of
                the per-service figures; also declares the coverage_of_measured_flow_pct denominator and
                the top_10_services_share_pct basis in-band'
            caveat:
              type: string
              description: 'In-band honesty note: a measured floor across listed services over 30d, not
                an ecosystem total; USDC via measured facilitators only'
        verified_count:
          type: integer
          description: 'Number of services in the FORTE verified tier (treno D3): a paid delivery-probe
            settled and delivered, drift-revocable. Same predicate as the ?verified=true list filter.
            Starts at 0 and grows only with real payments. SEMANTIC CHANGE: this used to count the broad
            "answers a valid 402 and is alive" set, which is now payment_ready_count.'
        payment_ready_count:
          type: integer
          description: 'Number of services in the BASE payment-ready tier (treno D3): answered a valid
            x402 challenge and alive within the decay window (a probe success within the last 7 days,
            or api-key exempt). Same predicate as the ?payment_ready=true list filter. The broad signal
            verified_count used to carry.'
        listing_growth:
          type: object
          description: 'TRENO A D9: how many services were first listed recently.'
          properties:
            new_7d:
              type: integer
              description: Services first listed in the last 7 days
            new_30d:
              type: integer
              description: Services first listed in the last 30 days
        facilitator_volume_usd_30d:
          type:
          - number
          - 'null'
          description: 'TRENO A D9: aggregate settlement volume (USD) over the trailing 30 days across
            measured (enabled) facilitators. A non-deduped SUPERSET of the listed-services flow (it is
            not restricted to listed payTo mappings), so it is not comparable one-to-one with the traction
            block. null (never a fabricated 0) until facilitator snapshots exist. See facilitator_volume_note.'
        facilitator_volume_note:
          type: string
          description: In-band note framing facilitator_volume_usd_30d as a non-deduped superset of the
            listed-services flow
    FacilitatorListItem:
      type: object
      description: A facilitator with independently on-chain-verified USDC volume across all measured
        chains. For USDC, USD volume equals token volume 1:1.
      properties:
        facilitator_id:
          type: string
          description: Stable facilitator identifier
          example: coinbase
        name:
          type: string
          example: Coinbase
        website_url:
          type:
          - string
          - 'null'
          format: uri
        volume_usd_24h:
          type: number
          description: 'On-chain USDC volume for today (UTC) so far, not a trailing 24-hour window: it
            resets at 00:00 UTC (USD)'
        volume_usd_7d:
          type: number
          description: On-chain USDC volume over the trailing 7 days (USD)
        volume_usd_30d:
          type: number
          description: On-chain USDC volume over the trailing 30 days (USD)
        volume_usd_all:
          type: number
          description: On-chain USDC volume over all recorded history (USD; from Jan 2026 when the history
            backfill is enabled)
        tx_count_24h:
          type: integer
          description: 'Settlement transaction count for today (UTC) so far, not a trailing 24-hour window:
            it resets at 00:00 UTC'
        tx_count_7d:
          type: integer
          description: Settlement transaction count over the trailing 7 days
        tx_count_30d:
          type: integer
          description: Settlement transaction count over the trailing 30 days
        tx_count_all:
          type: integer
          description: Settlement transaction count over all recorded history (from Jan 2026 when the
            history backfill is enabled)
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent on-chain settlement activity
        first_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Earliest measured settlement day (start of our measurement window, not the facilitator
            first on-chain activity, which can predate it by months); extends back as history is backfilled.
            null when never measured. Use it to tell a facilitator whose all-time spans its whole life
            from one whose window is only weeks deep.
        settler_count:
          type: integer
          description: Number of enabled on-chain settler addresses (EOAs)
        verification:
          type: string
          enum:
          - on-chain
          - listed
          description: '"on-chain" when settlement volume has been measured directly from blockchain transactions
            (volume_usd_all > 0); "listed" when the facilitator is catalogued but no volume has been measured
            yet'
        timeseries:
          type: array
          description: Daily volume series (oldest first); present only when include=timeseries
          items:
            $ref: '#/components/schemas/FacilitatorTimeseriesPoint'
        chains:
          type: array
          description: Per-(network,token) volume breakdown; present only when include=chains
          items:
            $ref: '#/components/schemas/FacilitatorChainBreakdown'
    FacilitatorChainBreakdown:
      type: object
      description: A facilitator volume on one (network, token). "on-chain" rows carry measured volume;
        "listed" rows are declared-but-not-yet-measured chains.
      properties:
        network:
          type: string
          description: Chain identifier as configured ('base', full-length 'solana:5eykt…' genesis hash,
            or CAIP-2 eip155:*); kept raw for backwards compatibility. Prefer network_caip2 for joins.
          example: base
        network_caip2:
          type:
          - string
          - 'null'
          description: Canonical CAIP-2 identifier for cross-endpoint joins (matches /networks .caip2
            and service pricing .network_caip2); null when the raw chain identifier is not recognized
          example: eip155:8453
        token_address:
          type:
          - string
          - 'null'
          description: Settlement token contract/mint address on that chain
        token_address_norm:
          type:
          - string
          - 'null'
          description: 'Normalized settlement token address for cross-endpoint joins: EVM addresses lowercased,
            non-EVM (e.g. Solana mints) kept as-is; null = unknown'
        asset_name:
          type:
          - string
          - 'null'
          description: Human asset label (e.g. "USDC")
        volume_usd_24h:
          type: number
          description: 'On-chain volume for today (UTC) so far, not a trailing 24-hour window: it resets
            at 00:00 UTC (USD)'
        volume_usd_7d:
          type: number
          description: On-chain volume over the trailing 7 days (USD)
        volume_usd_30d:
          type: number
          description: On-chain volume over the trailing 30 days (USD)
        volume_usd_all:
          type: number
          description: On-chain volume over all recorded history (USD)
        tx_count_all:
          type: integer
          description: Settlement transaction count over all recorded history
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent on-chain settlement activity on this chain
        verification:
          type: string
          enum:
          - on-chain
          - listed
          description: '"on-chain" if measured volume > 0 on this chain, else "listed"'
    FacilitatorTimeseriesPoint:
      type: object
      description: One day of a facilitator on-chain volume series
      properties:
        date:
          type: string
          description: UTC day, YYYY-MM-DD
          example: '2026-06-15'
        volume_usd:
          type: number
          description: On-chain USDC volume that day (USD)
        tx_count:
          type: integer
          description: Settlement transaction count that day
    FacilitatorDetail:
      type: object
      description: Full detail for a single facilitator (TRENO A D5). Carries the list-row fields plus
        avg $/settlement, a 7d-vs-previous-7d trend, per-chain buyers (an upper bound), the per-(network,token)
        chains breakdown with first_activity_at, the on-chain settlers, the daily series (honoring period=all),
        and the listed_services bridge.
      properties:
        facilitator_id:
          type: string
          example: coinbase
        name:
          type: string
          example: Coinbase
        website_url:
          type:
          - string
          - 'null'
          format: uri
        volume_usd_24h:
          type: number
          description: On-chain USDC volume for today (UTC) so far, not a trailing 24-hour window (USD)
        volume_usd_7d:
          type: number
          description: On-chain USDC volume over the trailing 7 days (USD)
        volume_usd_30d:
          type: number
          description: On-chain USDC volume over the trailing 30 days (USD)
        volume_usd_all:
          type: number
          description: On-chain USDC volume over all recorded history (USD)
        tx_count_24h:
          type: integer
          description: Settlement count for today (UTC) so far
        tx_count_7d:
          type: integer
        tx_count_30d:
          type: integer
        tx_count_all:
          type: integer
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
        settler_count:
          type: integer
          description: Number of enabled on-chain settler addresses (EOAs)
        verification:
          type: string
          enum:
          - on-chain
          - listed
        avg_settlement_usd_all:
          type:
          - number
          - 'null'
          description: Average USD per settlement over all history (volume_usd_all / tx_count_all); null
            when tx_count_all is 0 (never a fabricated 0).
        avg_settlement_usd_30d:
          type:
          - number
          - 'null'
          description: Average USD per settlement over the trailing 30 days; null when there are no settlements.
        trend_7d_vs_prev_7d:
          type:
          - number
          - 'null'
          description: Ratio of the last 7 days' volume to the previous 7 days' (same-length windows,
            so it IS the daily-rate comparison); null when the previous window is empty. Invariant, never
            re-divided.
        buyers:
          $ref: '#/components/schemas/FacilitatorBuyers'
        chains:
          type: array
          items:
            $ref: '#/components/schemas/FacilitatorDetailChain'
        settlers:
          type: array
          items:
            $ref: '#/components/schemas/FacilitatorSettler'
        listed_services:
          $ref: '#/components/schemas/FacilitatorListedServices'
        series:
          type: array
          description: Daily volume series (oldest first). With series_by=total each point is { date,
            volume_usd, tx_count }; with series_by=chain each point is { date, network, volume_usd }.
          items:
            $ref: '#/components/schemas/FacilitatorTimeseriesPoint'
        method:
          type: string
          description: 'In-band method frame: volume measured directly on-chain by settler-address attribution
            (USDC), never self-reported.'
        caveat:
          type: string
          description: 'In-band caveat: a measured floor, the avg/trend semantics, and the 24h today-so-far
            note.'
    FacilitatorBuyers:
      type: object
      description: 'Per-chain distinct on-chain buyers (E3). total_upper_bound_30d is a declared UPPER
        BOUND: buyers on different chains or tokens are not de-duplicated, and each per-chain figure sums
        daily distinct counts. Prefer the per-chain figures.'
      properties:
        by_chain:
          type: array
          items:
            type: object
            properties:
              network:
                type: string
                description: Chain identifier as configured
              network_caip2:
                type:
                - string
                - 'null'
                description: Canonical CAIP-2 identifier; null when the raw chain id is not recognized
              unique_buyers_30d:
                type: integer
                description: Distinct buyers on this chain over the trailing 30 days (sum of daily distinct
                  counts)
        total_upper_bound_30d:
          type: integer
          description: 'Straight sum of the per-chain figures: a strict upper bound, not an exact head
            count'
        caveat:
          type: string
          description: Mandatory in-band note declaring why the total is an upper bound
    FacilitatorDetailChain:
      type: object
      description: A facilitator volume on one (network, token), as served on the detail node. Same shape
        as FacilitatorChainBreakdown plus first_activity_at (C3).
      properties:
        network:
          type: string
          description: Chain identifier as configured ('base', full Solana genesis hash, or eip155:*);
            prefer network_caip2 for joins.
          example: base
        network_caip2:
          type:
          - string
          - 'null'
          description: Canonical CAIP-2 identifier; null when the raw chain id is not recognized
          example: eip155:8453
        token_address:
          type:
          - string
          - 'null'
          description: Settlement token contract/mint address on that chain
        token_address_norm:
          type:
          - string
          - 'null'
          description: Normalized settlement token address (EVM lowercased, non-EVM kept as-is); null
            = unknown
        asset_name:
          type:
          - string
          - 'null'
          description: Human asset label (e.g. "USDC")
        volume_usd_24h:
          type: number
          description: On-chain volume for today (UTC) so far (USD)
        volume_usd_7d:
          type: number
          description: On-chain volume over the trailing 7 days (USD)
        volume_usd_30d:
          type: number
          description: On-chain volume over the trailing 30 days (USD)
        volume_usd_all:
          type: number
          description: On-chain volume over all recorded history (USD)
        tx_count_all:
          type: integer
          description: Settlement count over all recorded history
        first_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: First on-chain settlement activity on this chain (C3); null when never seen
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent on-chain settlement activity on this chain
        verification:
          type: string
          enum:
          - on-chain
          - listed
          description: '"on-chain" if measured volume > 0 on this chain, else "listed"'
    FacilitatorSettler:
      type: object
      description: An enabled on-chain settler address (EOA) for this facilitator.
      properties:
        address:
          type: string
          description: Settler EOA address
        network:
          type: string
          description: Chain identifier as configured
        network_caip2:
          type:
          - string
          - 'null'
          description: Canonical CAIP-2 identifier; null when the raw chain id is not recognized
        source:
          type:
          - string
          - 'null'
          description: How the settler address was discovered (e.g. x402scan, submitted)
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent time this settler was observed settling
        token_name:
          type:
          - string
          - 'null'
          description: Settlement token label on this chain (e.g. USDC)
        token_decimals:
          type:
          - integer
          - 'null'
          description: Settlement token decimals
        enabled:
          type: boolean
          description: Whether the settler is currently enabled for measurement
    FacilitatorListedServices:
      type: object
      description: 'The facilitator -> listed-services bridge (D2 + C1): which directory services have
        settled on-chain via this facilitator. Volume is the service 30d figure over its payout mapping
        (a conservative floor); a service sharing a payout address is counted at the address level here
        (not re-divided pro-quota, since the split is per-service, not per-facilitator).'
      properties:
        all_time_count:
          type:
          - integer
          - 'null'
          description: Distinct listed services that settled via this facilitator over all history; null
            until the hourly precompute records it (never a fabricated 0).
        active_count_30d:
          type: integer
          description: Listed services with an attributed settlement via this facilitator over the trailing
            30 days
        top:
          type: array
          description: Top listed services by 30d volume (up to 10), link-able by slug
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              status:
                type: string
                enum:
                - online
                - degraded
                - offline
                - unknown
              volume_usd_30d:
                type: number
                description: Service 30d settlement volume over its payout mapping (USD)
              tx_count_30d:
                type: number
                description: Service 30d settlement count
        caveat:
          type: string
          description: 'In-band note: shared/address-level attribution and the null all-time-count until
            precompute'
    FacilitatorPaginationMeta:
      type: object
      properties:
        total:
          type: integer
          description: Total number of facilitators
        page:
          type: integer
          description: Current page number
        per_page:
          type: integer
          description: Results per page
        total_pages:
          type: integer
          description: Total number of pages
        timeframe:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          - all
          description: Window used to sort the results
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          description: Total number of results
        page:
          type: integer
          description: Current page number
        per_page:
          type: integer
          description: Results per page
        total_pages:
          type: integer
          description: Total number of pages
    Provenance:
      type: object
      description: Data provenance and license block. Present once per response, top-level in the envelope
        alongside data (and meta where present), never per item. Declares the CC BY 4.0 data license and
        how to attribute this data.
      properties:
        license:
          type: string
          enum:
          - CC-BY-4.0
          description: SPDX identifier of the data license (Creative Commons Attribution 4.0 International).
        attribution_required:
          type: boolean
          description: Whether attribution is required when reusing this data (always true under CC BY
            4.0).
        attribution:
          type: string
          description: Ready-to-use attribution string to display when reusing this data.
          example: 'Data: x402-list.com (CC BY 4.0)'
        cite_as:
          type: string
          format: uri
          description: 'Canonical URL to cite as the source of this specific resource: the human-readable
            page where one exists, otherwise the request URL without its query string.'
          example: https://x402-list.com/services/acme-generate
        source:
          type: string
          format: uri
          description: Canonical site origin behind the directory.
          example: https://x402-list.com
    BestRecommendation:
      type: object
      description: One ranked service recommendation from GET /best. All *_usd fields are decimal US dollars.
      properties:
        rank:
          type: integer
          description: 1-based position in the returned ranking
        slug:
          type: string
        name:
          type: string
        category:
          type: string
        status:
          type: string
          enum:
          - online
          - degraded
          - offline
          - unknown
        verified:
          type: boolean
          description: 'FORTE tier (treno D3): paid delivery-probe settled and delivered, drift-revocable,
            no time decay. The tier require_verified filters on.'
        payment_ready:
          type: boolean
          description: 'BASE tier (treno D3): answers a valid x402 challenge and is alive. The broad signal
            verified used to carry.'
        uptime_24h:
          type:
          - number
          - 'null'
        avg_response_time_ms:
          type:
          - integer
          - 'null'
        min_price_usd:
          type:
          - number
          - 'null'
          description: Entry (min) price in USD
        price_max_usd:
          type:
          - number
          - 'null'
          description: Highest tier price in USD; equals min_price_usd when flat
        category_percentile_max:
          type:
          - number
          - 'null'
        distinct_price_count:
          type:
          - integer
          - 'null'
          description: 1 = flat pricing, greater than 1 = tiered
        networks:
          type: array
          items:
            type: string
        endpoint_count:
          type: integer
        compliance_grade:
          type:
          - string
          - 'null'
          description: x402 conformance grade, capped at C when at least one EVM route is missing the
            EIP-712 domain parameters a standard x402 client needs in order to sign
        compliance_failed_checks:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Ids of the conformance checks that failed; [] = all pass, null = none graded. eip712_domain_extra
            here means a standard x402 client cannot sign a payment for at least one route of this service
        risk_level:
          type:
          - string
          - 'null'
          enum:
          - clean
          - warning
          - danger
          - null
        capability_tags:
          type:
          - object
          - 'null'
          description: AI-derived capability tags marked {value, confidence, source:"ai"}, or null when
            the model could not ground them
          properties:
            value:
              type: array
              items:
                type: string
            confidence:
              type: number
              description: 0-1
            source:
              type: string
              enum:
              - ai
        traction_status:
          type:
          - string
          - 'null'
          enum:
          - measured
          - no-payto
          - unmeasured-network
          - unresponsive
          - null
        volume_usd_30d:
          type:
          - number
          - 'null'
          description: Conservative undercount; pro-quota on a shared payout
        unique_buyers_30d:
          type:
          - number
          - 'null'
        shared_payout:
          type:
          - boolean
          - 'null'
        top_buyer_share_30d:
          type:
          - number
          - 'null'
          description: 0-1 concentration of the single largest buyer; a published signal, NOT part of
            the score
        score:
          type: number
          description: Final blended score (0-1), rounded to 2 decimals
        relevance:
          type:
          - number
          - 'null'
          description: Relevance sub-score (0-1) when a free-text q was given, else null
        quality:
          type: number
          description: Measured quality sub-score (0-1)
        why:
          type: string
          description: Short human-readable rationale
    FacilitatorContext:
      type: object
      description: 'Ecosystem facilitator context (NOT per-service): top facilitators by 7d settlement
        volume with a two-state verification flag.'
      properties:
        facilitator_id:
          type: string
        name:
          type: string
        volume_usd_7d:
          type: number
          description: decimal US dollars
        tx_count_7d:
          type: integer
        verification:
          type: string
          enum:
          - on-chain
          - listed
          description: '"on-chain" iff observed on-chain volume greater than zero, else "listed"'
    BestResult:
      type: object
      description: 'The GET /best data block: ranked recommendations plus the ranking basis, danger-excluded
        slugs, and optional facilitator context.'
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/BestRecommendation'
        ranking_basis:
          type: string
          description: Plain-language description of how the ranking was produced (the two-stage relevance-then-quality
            blend).
        excluded_danger:
          type: array
          items:
            type: string
          description: Slugs removed from the recommendation set by a deterministic danger flag (blocklist
            or impersonation match only).
        facilitator_context:
          description: Top facilitators by 7d settlement volume when include_facilitator_context=true,
            otherwise null.
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/FacilitatorContext'
          - type: 'null'
        note:
          type: string
          description: Present only when no service matched the given filters.
    AssessRequest:
      type: object
      required:
      - question
      - services
      description: 'On-demand assessment request: a need plus the shortlist of service slugs to compare
        for it.'
      properties:
        question:
          type: string
          maxLength: 1000
          description: The need to assess the shortlist against (1 to 1000 characters).
        services:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 8
          description: Service slugs to compare (1 to 8, de-duplicated, order kept).
        probe:
          type: object
          description: 'Optional live-probe target: also pay one listed service for real and analyze what
            it returns. When live probing is armed the single accepts[0] amount becomes $0.25 plus that
            endpoint price X, and the report gains a probe_report block; probe fees are non-refundable
            regardless of outcome. Ignored (advisor-only) when live probing is not armed.'
          required:
          - slug
          properties:
            slug:
              type: string
              description: Slug of one listed service to probe live.
            endpoint_path:
              type: string
              maxLength: 500
              description: Optional URL path on that service to probe, beginning with '/'. Omit to let
                the server pick the cheapest priced USDC-on-Base endpoint. Templated paths (with {param}
                or :param placeholders) cannot be probed live and are excluded from probing.
    AssessAnswer:
      type: object
      description: The AI-marked recommendation over the shortlist (family 10 advisor). AI-derived; not
        an endorsement, and it never overrides a measured value.
      properties:
        question:
          type: string
        recommendation:
          type: object
          properties:
            value:
              type: string
              description: One plain-language paragraph answering the need
            confidence:
              type: number
              description: '0-1: how strongly the signals support the recommendation'
            source:
              type: string
              enum:
              - ai
        ranking:
          type: array
          description: Candidates ordered best-first for the need; only slugs from the request appear
            (the model can never introduce one).
          items:
            type: object
            properties:
              slug:
                type: string
              reason:
                type: string
        model:
          type: string
        prompt_version:
          type: string
        candidates_considered:
          type: integer
        note:
          type: string
          description: Honest, evidence-based disclaimer.
    AssessReport:
      type: object
      description: 'The modular assessment report body: one block per priced module. It always carries
        the advisor answer under answer; a probe_report block is added when a live probe ran. Future modules
        add their own block additively.'
      properties:
        answer:
          $ref: '#/components/schemas/AssessAnswer'
        probe_report:
          description: Present only when a live probe ran (the request carried a probe target and live
            probing was armed). The truncated probe result; never the verbatim third-party body.
          oneOf:
          - $ref: '#/components/schemas/ProbeReport'
          - type: 'null'
    ProbeReport:
      type: object
      description: Live-probe result block (treno 4). The report of a real x402 payment to one listed
        service and an analysis of what it returned. It carries a verdict plus truncated evidence snippets
        and NEVER the verbatim third-party body. All *_atomic fields are atomic USDC (6-decimal integer
        strings), not dollars. Probe fees are non-refundable regardless of outcome.
      properties:
        version:
          type: integer
          description: probe_report block generation; bumps when this block shape changes.
        outcome:
          type: string
          enum:
          - settled
          - price_drift
          - endpoint_error
          description: settled = paid and analyzed; price_drift = the live price moved above the quote,
            so nothing was paid; endpoint_error = paid but the endpoint failed or was unreadable.
        settle_ok:
          type: boolean
          description: true only when the OUTBOUND probe payment settled on-chain (a tx_hash is present).
        target:
          type: object
          description: The probed target.
          properties:
            slug:
              type: string
            endpoint_path:
              type: string
            network:
              type: string
              description: Canonical CAIP-2 network of the probed endpoint.
        quoted_x_atomic:
          type: string
          description: Endpoint price X quoted at assessment time (atomic USDC string).
        paid_atomic:
          type: string
          description: Atomic USDC actually sent to the endpoint ('0' when nothing was spent, e.g. on
            price_drift).
        live_price_atomic:
          type:
          - string
          - 'null'
          description: Live endpoint price observed on the fresh 402 (atomic USDC string), or null when
            unreadable.
        http_status:
          type:
          - integer
          - 'null'
          description: Endpoint HTTP status after payment, or null.
        latency_ms:
          type:
          - integer
          - 'null'
        content_type:
          type:
          - string
          - 'null'
        size_bytes:
          type:
          - integer
          - 'null'
        schema_conformance:
          type: string
          enum:
          - valid_json
          - invalid_json
          - non_json
          - no_response
          description: Deterministic verdict on the returned body from its declared content type and parseability.
        ai_analysis:
          description: AI verdict on what the endpoint returned, marked {value, confidence, source:'ai'};
            null when the model missed or the key is unset. Fail-soft, and it never contains the verbatim
            body.
          oneOf:
          - type: object
            properties:
              value:
                type: string
              confidence:
                type: number
                description: 0-1
              source:
                type: string
                enum:
                - ai
          - type: 'null'
        extracts:
          type: array
          items:
            type: string
          description: Up to 3 truncated evidence snippets (each hard-capped); NEVER the verbatim third-party
            body.
        tx_hash:
          type:
          - string
          - 'null'
          description: On-chain settlement tx hash of the outbound probe payment, or null when nothing
            settled.
        note:
          type: string
          description: 'Policy note: charged $0.25 plus X, non-refundable regardless of outcome, snippets
            truncated, full response never resold.'
    ServiceSubmissionRequest:
      type: object
      description: 'Service submission body: the default branch of POST /submit when "type" is omitted'
      required:
      - url
      - email
      - service_name
      - description
      - website_url
      - category
      - endpoints
      properties:
        type:
          type: string
          description: Optional submission type discriminator. Omit for services; any value other than
            "facilitator" is treated as a service submission.
        url:
          type: string
          format: uri
          description: Base URL of the x402 service. On a free compute host (vercel.app, workers.dev and
            similar) the endpoint answers HTTP 402 and the submission costs a one-off, non-refundable
            $1 USDC on Base; on static-only hosting or a dev tunnel it is rejected with HTTP 400 at any
            price
        email:
          type: string
          format: email
          description: Submitter contact email
        service_name:
          type: string
          description: Human-readable name of the service
        description:
          type: string
          description: Brief description of what the service does
        website_url:
          type: string
          format: uri
          description: Public website URL
        category:
          type: string
          description: Service category (use /categories to get valid values)
        endpoints:
          type: array
          items:
            type: string
          description: List of endpoint paths to probe (e.g. ["/v1/generate", "/v1/translate"])
        notes:
          type: string
          description: Optional additional context
    FacilitatorSubmissionRequest:
      type: object
      description: 'Facilitator submission body, selected by "type": "facilitator". Facilitators are settlement
        infrastructure: they are verified by on-chain settlement activity from their settler addresses,
        never by an HTTP 402 probe. Approved facilitators are listed on GET /facilitators with verification
        "listed" and switch to "on-chain" automatically once settlement volume is measured.'
      required:
      - type
      - email
      - facilitator_name
      - website_url
      - settler_addresses
      - networks
      properties:
        type:
          type: string
          enum:
          - facilitator
          description: Selects the facilitator branch of POST /submit
        email:
          type: string
          format: email
          description: Submitter contact email
        facilitator_name:
          type: string
          maxLength: 255
          description: Human-readable facilitator name
        website_url:
          type: string
          format: uri
          description: Public website URL (own domain; free hosting and dev-tunnel domains are rejected)
        description:
          type: string
          description: Optional description of what the facilitator does
        settler_addresses:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 25
          description: 'On-chain addresses that originate settlement transactions: 0x EVM addresses (40
            hex chars) or base58 Solana addresses (32-44 chars). Also accepted as one comma/newline separated
            string.'
        networks:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 25
          description: Declared settlement networks (e.g. "base", "polygon", "solana"). Enabled EVM chains
            are probed on-chain before review; other chains are recorded as declared claims. Also accepted
            as one comma/newline separated string.
        facilitator_id_slug:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Optional proposed identifier slug (lowercase letters, digits, single hyphens).
            Reserved names are flagged for manual review.
        token_claims:
          type: array
          items:
            type: string
          maxItems: 25
          description: Optional list of tokens the facilitator claims to settle (informational only)
        claimed_volume_usd:
          type:
          - string
          - number
          description: Optional self-reported all-time settlement volume in USD (informational only; cross-checked
            against the on-chain probe at review)
        notes:
          type: string
          description: Optional additional context
    ServiceUpdateRequest:
      type: object
      description: 'Owner update request body (F10). Send ALL fields prefilled with the live listing values:
        the server computes the diff and records only what actually changed. Empty or omitted fields are
        always treated as UNCHANGED (nothing can be cleared through this channel). Only declarative metadata
        is updatable; measured fields (verified, uptime, pricing, status, payTo) are read-only for everyone.'
      required:
      - email
      properties:
        email:
          type: string
          format: email
          description: 'Requester email: receives the review outcome. Subject to the per-(email, service)
            7-day cooldown'
        name:
          type: string
          maxLength: 255
          description: 'Proposed service name (the slug NEVER changes: citations and monitor history hang
            off it)'
        base_url:
          type: string
          format: uri
          description: Proposed base URL. Changing it is an identity change and is reviewed with extra
            scrutiny; the ownership proof is always checked on the CURRENT domain
        website_url:
          type: string
          format: uri
          description: Proposed website URL (dev-tunnel domains are rejected; free hosting is allowed)
        category:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        contact_email:
          type: string
          format: email
          description: Proposed owner contact email; empty string = keep unchanged
        endpoints_add:
          type: array
          items:
            type: string
          maxItems: 50
          example:
          - /v1/summarize
          - POST /v1/chat/completions
          description: NEW x402-protected endpoints to add, one per entry, as "/v1/resource" or "POST
            /v1/resource". GET and POST are the accepted methods (case-insensitive) and an entry with
            no method prefix is taken as GET. Method and path together identify an endpoint, so "POST
            /x" is a new addition even when "GET /x" is already listed; an entry already listed with the
            same method is silently ignored. Endpoints cannot be removed from here. The endpoint is probed
            for HTTP 402 with the declared method after ownership verification. Also accepted as one newline-separated
            string.
    SuggestionRequest:
      type: object
      description: Paid suggestion body (F11). Only "text" is required; the request must be paid ($0.10
        USDC on Base via the x402 handshake). Suggestions are internal and manually reviewed, never published.
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: The suggestion (1 to 2000 characters)
        category:
          type: string
          enum:
          - feature
          - bug
          - data
          - other
          default: other
          description: Suggestion category (defaults to "other" when omitted)
        email:
          type: string
          format: email
          description: 'Optional contact email: receives the review outcome'
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
    PaymentRequirements:
      type: object
      description: A single x402 payment option (one element of accepts[]).
      properties:
        scheme:
          type: string
          enum:
          - exact
        network:
          type: string
          description: CAIP-2 network id
          example: eip155:8453
        asset:
          type: string
          description: Token contract address
          example: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
        amount:
          type: string
          description: Atomic USDC (6 decimals) as a string; "500000" = $0.50
          example: '500000'
        payTo:
          type: string
          description: Receiving wallet address
        maxTimeoutSeconds:
          type: integer
          example: 300
        extra:
          type: object
          description: EIP-712 signing domain parameters
          properties:
            name:
              type: string
              example: USD Coin
            version:
              type: string
              example: '2'
    PaymentRequired:
      type: object
      description: x402 v2 PaymentRequired body returned on a 402 (also base64-encoded in the PAYMENT-REQUIRED
        response header).
      properties:
        x402Version:
          type: integer
          enum:
          - 2
        accepts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRequirements'
        resource:
          type: object
          description: The paid resource this 402 guards (echoed by the x402 server).
          properties:
            url:
              type: string
              example: https://x402-list.com/api/v1/submit
            description:
              type: string
              example: Resubmission fee after a rejected submission
            mimeType:
              type: string
              example: application/json
            serviceName:
              type: string
              example: x402 List
        error:
          type: string
          description: App-level error code, e.g. resubmission_fee_required
        message:
          type: string
          description: Human-readable explanation with a pointer to /api (body only; absent from the PAYMENT-REQUIRED
            header)
  headers:
    MeterRemaining:
      schema:
        type: integer
      description: Free metered GET requests left today for this IP (see the metering note in the API
        description).
    MeterReset:
      schema:
        type: integer
      description: 'Unix timestamp (seconds) at which this IP''s free daily metered-GET quota resets:
        the next 00:00 UTC. Same shape as X-RateLimit-Reset. Lets a caller behind a shared egress IP tell
        when the per-IP quota rolls over.'
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: 404
              message: Service not found
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: 500
              message: Internal server error
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: 429
              message: Too many requests. Please slow down.
    MeteredPaymentRequired:
      description: 'Metered: this IP is beyond the free daily quota (2,000 GET requests/day per IP on
        /api/v1/*). Each further request costs $0.01 USDC (x402) on Base. Pay accepts[0] with an x402-capable
        client and retry the same request with a PAYMENT-SIGNATURE header; the successful response then
        carries a PAYMENT-RESPONSE header. The PAYMENT-REQUIRED response header carries the same x402
        PaymentRequired object base64-encoded, without the app-level message field (body only).'
      headers:
        PAYMENT-REQUIRED:
          schema:
            type: string
          description: base64 JSON of the x402 PaymentRequired object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRequired'
