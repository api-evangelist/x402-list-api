source: >-
  Derived from the provider's own contract at
  https://x402-list.com/api/v1/openapi.json and the documents it serves under
  /.well-known/ (security.txt, api-catalog, apis.json, api-onboarding, the
  Spectral ruleset), each fetched directly on 2026-09-02 with the HTTP status
  recorded in well-known/x402-list-api-well-known.yml. Every `conforms: true`
  below points at an exact location in a document that was fetched, not at a
  marketing claim.
description: >-
  x402 List's conformance profile is unusual: it declares almost nothing about
  enterprise identity standards (no OAuth, no OIDC, no SCIM, no OData — because
  it has no accounts at all) while conforming hard to the small set of standards
  that matter for a machine-readable, agent-first, paid-per-call directory. The
  domain standard for its market is the x402 protocol itself, and the contract
  does not merely mention it: it specifies x402 v2 structurally, with the version
  pinned by enum, the challenge and proof headers named, CAIP-2 network
  identifiers, and the EIP-712 signing-domain parameters a standard x402 client
  needs in order to sign.
