domain_standards:
  - id: x402
    name: x402 protocol (HTTP 402 Payment Required, version 2)
    market: agentic / machine-to-machine payments
    conforms: true
    role: both consumer and subject — x402 List is a directory OF x402 services that is itself paid over x402
    evidence:
      - location: components.schemas.PaymentRequired.x402Version
        detail: 'Typed integer with enum [2] — the protocol version is pinned structurally, not described in prose.'
      - location: components.schemas.PaymentRequired.accepts[] -> components.schemas.PaymentRequirements
        detail: >-
          Full x402 payment-option shape: scheme (enum ["exact"]), network,
          asset, amount (atomic USDC as a string), payTo, maxTimeoutSeconds and
          extra.
      - location: response headers declared across the contract
        detail: >-
          PAYMENT-REQUIRED on every 402 (the same object base64-encoded),
          PAYMENT-SIGNATURE on the paid retry, PAYMENT-RESPONSE on the paid 2xx.
          12, 10 and several occurrences respectively in the document.
      - location: components.schemas.PaymentRequirements.network
        detail: >-
          CAIP-2 chain identifiers (example "eip155:8453" for Base). "caip"
          appears 26 times and "eip155" 20 times in the contract; list items also
          carry a networks_caip2 array alongside the human abbreviations.
      - location: components.schemas.PaymentRequirements.extra
        detail: >-
          EIP-712 signing-domain parameters (extra.name, extra.version) — the
          fields a standard x402 client requires in order to sign a payment. The
          provider runs a deterministic 14-check compliance list against listed
          services, three checks of which test exactly this signability.
    why_it_matters: >-
      A buyer who already speaks x402 integrates with no bespoke connector: the
      402 envelope, the CAIP-2 network id, the atomic USDC amount and the EIP-712
      domain are all where a conformant client expects them. That is the whole
      point of the directory, and the contract practises it on itself.
  - id: caip-2
    name: CAIP-2 blockchain namespace identifiers
    market: blockchain interoperability
    conforms: true
    evidence:
      location: components.schemas.PaymentRequirements.network and networks_caip2 on service list items
      detail: 'Example "eip155:8453"; both the payment envelope and the directory records carry CAIP-2 ids beside the short abbreviations.'
  - id: eip-712
    name: EIP-712 typed structured data signing
    market: EVM
    conforms: true
    evidence:
      location: components.schemas.PaymentRequirements.extra
      detail: extra.name and extra.version carry the signing domain; measured as a first-class compliance check across the directory.
compliance_certifications:
  published: false
  note: >-
    No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP claim is made anywhere on the
    site, and no trust center exists. That is consistent with a single-operator
    directory that holds no customer data and issues no credentials — recorded as
    an honest absence, and no Compliance pointer is emitted.
