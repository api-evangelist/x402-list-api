name: x402 List API
description: An open, machine-readable, live-monitored directory of services that accept x402 protocol payments
  (HTTP 402 Payment Required). Self-described as agent-first, it exposes service listings, uptime metrics, pricing,
  facilitator settlement data, and rankings as JSON for autonomous agents, aggregators, and integrations.
