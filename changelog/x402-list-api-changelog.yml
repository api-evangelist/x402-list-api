description: >-
  READ THIS BEFORE TRUSTING THE POINTER. x402 List declares changes.xml as its
  ChangeLog, and it is a real, live, dated, machine-readable feed — but it
  records changes to the DATA (payout-address rotations, price moves and payment
  schema drift observed on listed third-party services' x402 wire), not changes
  to this API. There is no API release note, no version history and no
  "what's new" page anywhere on the site. Both facts are recorded here so the
  artifact cannot be misread as a versioned API changelog.
