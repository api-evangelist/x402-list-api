crosswalk:
  - tool: x402_search_services
    category: discovery
    rest: [listServices]
    binding: one-to-one
    confidence: high
    note: >-
      Tool parameters q/category/network/status/signable/sort/page/per_page are
      the listServices query parameters by the same names. verified_only maps to
      the REST `verified` boolean filter; `fields` is an MCP-side response
      projection with no REST equivalent.
  - tool: x402_get_service
    category: detail
    rest: [getService, getServiceUptime, getServicePriceHistory, getServiceScores, getServiceVolume, getServiceBuyers]
    binding: composite
    confidence: high
    note: >-
      slug maps to the getService path parameter. include_series is the
      composition switch: with it set the tool folds in the per-slug series
      endpoints (uptime, price, scores, volume, buyers) that are separate REST
      operations.
  - tool: x402_find_best_service
    category: recommendation
    rest: [getBestServices]
    binding: one-to-one
    confidence: high
    note: >-
      Exact parameter parity with GET /best
      (q, category, network, max_price_usd, require_verified, prefer, limit,
      include_facilitator_context). The provider's own llms.txt states this is
      "the same relevance-then-quality ranking as the MCP x402_find_best_service
      tool".
  - tool: x402_check_health
    category: monitoring
    rest: [getServiceChecks, getServiceUptime, getStatus, getGlobalChecks]
    binding: composite
    confidence: medium
    note: >-
      With a slug it is the per-service check/uptime pair; with no slug the
      server instructions say it answers system-wide, which is GET /status and
      GET /checks. include_services selects the fan-out.
  - tool: x402_facilitator_volumes
    category: settlement
    rest: [listFacilitators, getFacilitator]
    binding: composite
    confidence: high
    note: >-
      timeframe/days/page/per_page map to the list operation; include_chains and
      include_timeseries pull the per-chain breakdown and daily series that GET
      /facilitators/{id} carries.
  - tool: x402_change_events
    category: monitoring
    rest: [listServiceChanges]
    binding: one-to-one
    confidence: high
    note: service/type/days/page/per_page are the GET /changes query parameters.
  - tool: x402_assess_services
    category: analysis
    rest: [postAssess]
    binding: one-to-one
    confidence: high
    note: >-
      POST /assess. Both charge $0.25 USDC on Base over x402. The tool takes
      payment_signature_b64 as an argument where the REST operation takes the
      PAYMENT-SIGNATURE request header — the server holds no wallet keys, so the
      caller signs.
