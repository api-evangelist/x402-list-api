source: >-
  Derived by binding the seven tools returned by a live tools/list against
  https://mcp.x402-list.com/mcp (2026-09-02, anonymous, HTTP 200) to the 23
  operations in the provider's own OpenAPI 3.1 document at
  https://x402-list.com/api/v1/openapi.json. Both surfaces are first-party and
  both were fetched unauthenticated, so every binding below is checked against a
  real inputSchema and a real operationId — none is inferred from prose.
description: >-
  x402 List's MCP server is a thin, honest wrapper over its public REST API: all
  seven tools bind to published operations, and the tool parameter names are the
  REST query parameter names almost verbatim (q, category, network, status,
  signable, sort, page, per_page). The interesting asymmetry runs the other way —
  the write half of the REST API (submission, owner-update, ownership
  verification, the paid suggestion box) has no MCP tool at all, so an agent can
  read and price the directory over MCP but cannot change it.
